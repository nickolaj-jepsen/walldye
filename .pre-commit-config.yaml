# Git hooks, run by prek: `uv run prek install` once per clone. CI runs the same checks.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, markdown]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyrefly-library
        name: pyrefly (library, strictest preset)
        entry: uv run pyrefly check
        language: system
        files: ^walldye/
        pass_filenames: false
      - id: pyrefly-designs
        name: pyrefly (designs)
        entry: uv run pyrefly check -c wallpapers/pyrefly.toml
        language: system
        files: ^wallpapers/[^/]+/design\.py$
      - id: biome
        name: biome (format, lint and import order for TypeScript)
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, javascript]
