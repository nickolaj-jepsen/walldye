title: Spectrogram
description: A whistled tune on a spectrogram is a single line, since a whistle is nearly a pure tone.
alt: A heavy wavy line of grainy dots with two thinner copies above it, broken into three phrases, the last cut off at a vertical marker.
notes: |
  A spectrogram runs time from left to right and pitch upward, and louder sound is drawn heavier. The fainter lines are overtones, at whole multiples of the whistled pitch.
