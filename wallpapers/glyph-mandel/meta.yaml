title: ASCII Mandelbrot
description: The Mandelbrot set as a 1980s text printout, edged in at-signs, with bands of asterisks and dashes thinning outward.
notes: |
  Each character stands for a small patch of the plane, and an estimate of that patch's distance from the set chooses it. Printouts of the time counted escape steps instead, so their bands spread unevenly around the edge.
