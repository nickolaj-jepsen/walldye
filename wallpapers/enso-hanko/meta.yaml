title: Enso and seal
description: One brushstroke of enso breaks into dry bristle streaks as the ink runs out, beside a small carved seal.
notes: |
  The stroke is built from three dozen separate bristles, each running dry at its own rate, so the ring splits into streaks on its way round and thins to a few hairs at the tail. The seal is cut in the baiwen style, with a made-up character carved out of the stone and printing as gaps.
