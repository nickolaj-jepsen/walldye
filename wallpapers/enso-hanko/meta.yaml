title: Enso and seal
description: An ensō is a circle drawn in one or two brushstrokes, thinning as the brush runs out of ink.
alt: A circle in one brushstroke starts thick at lower left and thins to streaks along the bottom, next to a small square seal.
notes: |
  The stroke is built from three dozen separate bristles, each running dry at its own rate. The seal is cut in the baiwen style, with a made-up character carved out of the stone and printing as gaps.
