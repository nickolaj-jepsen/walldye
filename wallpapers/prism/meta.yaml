title: Prism
description: A ray bends through a prism into six bands, each fainter than the last, with dashed normals marking the angles.
notes: |
  Each ray is traced with Snell's law at both faces. The refractive index runs from 1.22 to 1.46 across the fan, far more spread than real glass gives, so the bands open wide, and the seven rays that bound them are chosen to leave at evenly spaced angles.

  The layout follows the Hipgnosis cover for *The Dark Side of the Moon*, with the construction lines of an optics diagram drawn in.
