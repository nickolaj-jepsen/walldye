title: Digital rain
description: Falling hex digits fade toward their tails. One stream is led by a block with its digit cut out.
notes: |
  The falling code in *The Matrix* was set in a custom typeface of mirrored half-width kana, Latin letters and numerals. This rain keeps to hexadecimal digits, with about one in eight drawn back to front.
