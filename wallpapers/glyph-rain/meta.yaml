title: Digital rain
description: The code rain in *The Matrix* used mirrored kana, letters and numerals, and this one uses hexadecimal digits.
alt: Columns of hexadecimal digits fall down the screen, thinning toward their tails, and one is headed by a solid block with its digit cut out.
notes: |
  About one digit in eight is drawn back to front, as the film's characters were.
