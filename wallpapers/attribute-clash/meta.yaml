title: Attribute clash
description: A night road in ordered dither on a ZX Spectrum screen. The car's tail lights recolour every 8x8 attribute cell they touch.
notes: |
  The ZX Spectrum stored colour once per 8x8 block of pixels, one ink and one paper for the whole block. Anything lit inside a block recolours every ink pixel in it, and that spill is attribute clash.
technique: [pixel, dither]
