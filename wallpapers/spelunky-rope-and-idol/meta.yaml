title: Spelunky idol room
description: Two cave rooms from the first Spelunky, traced pixel for pixel. A tiki statue stands over the idol, a rope beside it.
notes: |
  *Spelunky* assembles each level from a grid of rooms, picking every room's layout at random from a short list. The idol room is on the right and a room of ledges on the left, with every sprite copied from the game's source.
