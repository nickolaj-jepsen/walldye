title: Papercut tunnel
description: Tunnel books place cut-paper panels one behind the other to create an illusion of depth.
alt: Rings of cut paper with wavy edges nest around a small round opening right of center, each layer casting a shadow on the one behind.
notes: |
  Here each opening is a circle bent by a few broad waves, which flatten out on the smallest holes, plus a faint hand-cut waver. Wider and taller screens get extra sheets in front, and on the widest the outer holes widen as well, so the tunnel still fills the view.
