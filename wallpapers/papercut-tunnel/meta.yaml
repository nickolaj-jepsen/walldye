title: Papercut tunnel
description: Sheets cut with wavering holes stack into a paper tunnel, each shadowing the next, back to a small lit opening.
notes: |
  Tunnel books and paper peepshows stand cut-paper panels one behind the other, so a scene recedes when you look through the front opening. Here each opening is a circle bent by a few broad waves, which flatten out on the smallest holes, plus a faint hand-cut waver. Wider and taller screens get extra sheets in front, and on the widest the outer holes widen as well, so the tunnel still fills the view.
