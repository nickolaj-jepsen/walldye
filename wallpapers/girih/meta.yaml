title: Girih rosette
description: A girih star pattern fades out around one filled twelve-pointed star and its two rings of tiles.
notes: |
  E. H. Hankin showed in 1925 how such patterns can be drawn from polygons in contact. Rays leave the midpoint of every edge of a tiling at a fixed angle, and each one stops where it meets its partner from another edge. Here the tiling is dodecagons and triangles, the angle is 60 degrees, and each dodecagon holds a twelve-pointed star.
