title: Great Belt depths
description: The Great Belt between Funen and Zealand in depth contours every five meters. The 50 m line around its deepest hole, under the East Bridge, is picked out.
notes: |
  The depths come from EMODnet's bathymetry grid for European seas, resampled to 250 m and softened before the contours are traced. A heavier line falls every 10 m, the coast is rounded further so harbor moles blend into the shore, and the smallest shoals, islets, inlets and lakes are left out, as are slivers of land or water at the edges. In deep water a 5 m line gives way where it crowds against a 10 m line.

  The Belt's deep water runs in a narrow, winding channel. At Sprogø it squeezes into the East Channel, where it drops below 50 m in a trough about five kilometers long. The 50 m contour around that trough is picked out, with the 45 m contour faintly beside it. The map is north up, on every screen shape.
