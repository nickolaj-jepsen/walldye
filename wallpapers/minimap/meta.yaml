title: Minimap
description: A code editor's minimap, blown up so each word is a rounded bar. The identifier under the caret is highlighted.
notes: |
  The code is made up: Python-like imports, classes and nested blocks, each bar as long as the name or string it stands for. Outside the band the bars fade out towards the top and bottom of the screen.
