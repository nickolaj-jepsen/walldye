title: Bonneville timed mile
description: The Bonneville speed course at eye level, its guide line crossing the salt's polygon ridges towards Floating Island. The first timed mile, a sliver in perspective, is lit.
notes: |
  The International Racetrack on the Bonneville Salt Flats runs from southwest to northeast and points almost straight at Floating Island, 27 km away, with the Silver Island Mountains to its left. The skyline comes from Shuttle Radar Topography Mission elevations, seen from 1.7 m above the salt and allowing for the curve of the earth, which puts the salt's own horizon about 5 km off.

  The course was first marked with a broad painted line down its centre, later with one along each side, and after 2009 with flags and cones. At Speed Week the timed miles usually run from the second mile to the fifth. The first of them is lit, seen from 25 m short of the two-mile marker, and the whole mile takes up less of the picture than the 20 m of line at the viewer's feet.

  The salt dries into polygons roughly 1 to 3 m across and builds up ridges along the cracks.
