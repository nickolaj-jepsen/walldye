title: Bonneville timed mile
description: Bonneville's speed course runs over salt crust that dries into polygons a few meters wide.
alt: A broad line runs from the lower left across cracked polygon ground to a low mountain horizon; its far end is the first timed mile.
notes: |
  The International Racetrack on the Bonneville Salt Flats runs from southwest to northeast and points almost straight at Floating Island, 27 km away, with the Silver Island Mountains to its left. The skyline comes from Shuttle Radar Topography Mission elevations, seen from 1.7 m above the salt and allowing for the curve of the earth, which puts the salt's own horizon about 5 km off.

  The course was first marked with a broad painted line down its center, later with one along each side, and after 2009 with flags and cones. At Speed Week the timed miles usually run from the second mile to the fifth. The first of them is seen from 25 m short of the two-mile marker.
