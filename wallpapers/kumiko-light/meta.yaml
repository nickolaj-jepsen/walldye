title: Kumiko light
description: A lamp behind a tall asanoha shoji panel lights a six-pointed star of cells, fading out in three steps.
notes: |
  Kumiko is Japanese lattice joinery: thin wooden laths are notched and fitted together without nails, mostly for shoji doors and screens. In the asanoha pattern, named after the hemp leaf, lines from the centre of each triangle of the lattice to its corners split it into three cells.
