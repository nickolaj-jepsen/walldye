title: Kumiko light
description: A shoji panel in the asanoha pattern, which joins each lattice triangle's center to its corners.
alt: A tall panel of triangular lattice cells, with a six-pointed star of cells lit from behind and fading out in three steps.
notes: |
  Kumiko is Japanese lattice joinery: thin wooden laths are notched and fitted together without nails, mostly for shoji doors and screens. Asanoha is named after the hemp leaf, and its lines split each triangle into three cells.
