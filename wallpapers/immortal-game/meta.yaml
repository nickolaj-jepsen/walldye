title: Immortal game
description: Anderssen and Kieseritzky's 1851 game at mate. Lines trace the last thirteen moves, the pieces Anderssen lost stand beside the board, and the mating bishop is picked out.
notes: |
  Played in London in 1851. Anderssen lost two pawns and a bishop along the way, then gave up both rooks and his queen, and mated with the two knights and the bishop he had left. The lines follow every move from the knight's jump to d5 on move 17 to the end.
