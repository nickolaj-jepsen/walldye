title: Core rope
description: Fifty-two wires thread through eight ring cores or loop around them. The lit one passes through four.
notes: |
  Core rope memory held the fixed program of the Apollo Guidance Computer. A sense wire threaded through a core stores a 1, and one routed around it stores a 0; read along the picked-out wire, these eight cores hold 10110010.
