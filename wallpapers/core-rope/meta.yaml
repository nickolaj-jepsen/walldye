title: Core rope
description: Core rope memory stores a bit by whether a wire passes through a ferrite core or around it.
alt: A row of eight rings with many thin wires looping through and around them, and one wire traced across all eight, passing through four.
notes: |
  Core rope memory held the fixed program of the Apollo Guidance Computer. Fifty-two wires run through these eight cores. Read along the traced wire, the eight cores hold 10110010.
