title: Pixel bonsai
description: An informal upright bonsai has a bending trunk, with its apex directly above where the trunk meets the soil.
alt: A small tree of square pixels in a shallow tray, with a leaning trunk and four flat pads; a leaf falls beside the right-hand pad.
notes: |
  The style is called moyogi. Each pad is a row of overlapping bumps cut flat underneath, with a scalloped rim along the top.
