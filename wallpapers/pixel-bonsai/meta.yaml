title: Pixel bonsai
description: A pixel-art bonsai in a shallow tray. One pad's tip has turned for autumn and is dropping a leaf.
notes: |
  The tree is in the informal upright style, moyogi: the trunk and branches bend, but the apex stands straight above the point where the trunk enters the soil. Each pad is a row of overlapping bumps cut flat underneath, with a scalloped rim along the top.
