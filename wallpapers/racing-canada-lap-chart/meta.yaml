title: Montreal lap chart
description: A lap chart of the 2011 Canadian Grand Prix, which rain stopped for over two hours.
alt: One line per car steps between positions across a chart split by a gap; a single line falls to last, then climbs to first.
notes: |
  Each line is one car's race position at the end of every lap. The race started behind the safety car on a wet track and was stopped for over two hours in heavy rain, and positions are held through the stoppage.

  Button made five pit stops and served a drive-through for speeding behind the safety car. On lap 37 he touched Fernando Alonso at turn 3, pitted with a puncture and fell to 21st and last. Sebastian Vettel was leading on the final lap when he ran wide at turn 6, and Button went by to win. The positions come from jolpica-f1, a community-run archive of Formula 1 results that carries on the Ergast database.
