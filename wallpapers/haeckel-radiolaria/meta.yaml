title: Radiolarian cutaway
description: Some radiolarians build lattice shells nested inside one another, linked by radial beams.
alt: A round lattice shell with spines radiating from it, cut open at one eighth to show two smaller shells nested inside.
notes: |
  Each shell is a geodesic sphere: an icosahedron's faces split into small triangles and pushed out onto the sphere. A round pore sits at every corner, and what is left between them makes the lattice. Fourteen spines leave the outer shell, six along its axes and eight between them; those rooted in the cut went with it, and those pointing nearly straight toward or away from the viewer are left out. Thin beams run from the smallest shell out to the roots of the spines. The style comes from Haeckel's plates; no single figure in them is copied.
