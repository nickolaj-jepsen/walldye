title: Lorenz attractor
description: Solutions to Edward Lorenz's three equations for convection circle two wings and never settle or repeat.
alt: Fine overlapping loops form two lobes side by side, and a single stroke sweeps from the top of the left lobe into the right one.
notes: |
  The equations are `dx/dt = σ(y − x)`, `dy/dt = x(ρ − z) − y` and `dz/dt = xy − βz`, from Lorenz's 1963 reduction of a convection model. With σ = 10, ρ = 28 and β = 8/3 the orbit circles one wing, then the other, in no fixed order. This one starts near the origin and takes 25,500 fourth-order Runge–Kutta steps of 0.004, of which the first 500 are dropped. It is seen from the side, across x and z, turned 14 degrees.
