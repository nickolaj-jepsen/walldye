title: Jade's lighthouse
description: Jade's lighthouse off Hillys at night, in dithered cells. Its rays fan out, and the reflection breaks up on the sea.
notes: |
  In *Beyond Good & Evil*, Jade runs this island lighthouse as a home for children orphaned by the DomZ attacks. The mainland rises on the horizon, and two far beacons stand in the sea at either side.
