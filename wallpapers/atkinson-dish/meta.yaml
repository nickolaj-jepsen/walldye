title: Dish at dusk
description: Dusk over a radio telescope in one-bit Atkinson dither. A single light marks where its three struts meet.
notes: |
  Bill Atkinson's dither, used on the original Macintosh, passes on only six eighths of each pixel's rounding error, so the faintest haze above the horizon comes out empty.
