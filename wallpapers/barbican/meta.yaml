title: Barbican tower
description: One of the three 42-storey towers of London's Barbican Estate, at night.
alt: Round-ended balcony bands stack under a saw-tooth crown on a concrete tower at night, with one lit window near the middle, its curtain half drawn.
notes: |
  A lit window seen from outside at night comes from Edward Hopper's *Night Windows* (1928). The tower follows the concrete residential towers of the Barbican Estate in London.
