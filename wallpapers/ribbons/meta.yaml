title: Ribbons
description: Mostly edge to edge, ribbons of mixed widths follow a flow field without touching. Five high on the right are lit.
notes: |
  The method comes from Tyler Hobbs's *Fidenza*. Each ribbon is a streamline of a Perlin noise field, grown both ways from its starting point until it comes within a set gap of a neighbour. The school is laid first with a wider gap around it, then the ribbons that start near the middle, so most cross the whole frame. Towards the left edge the field turns less and the current enters almost level. On narrow screens the school shortens and moves inwards so both of its ragged ends stay in view.
