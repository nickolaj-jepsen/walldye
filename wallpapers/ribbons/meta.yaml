title: Ribbons
description: Ribbons of mixed widths trace a flow field without touching, a school of five picked out high on the right.
notes: |
  The layout follows Tyler Hobbs's *Fidenza*. Each ribbon is a streamline of a Perlin noise field, grown both ways from a starting point until it comes within a fixed gap of a neighbour or leaves the frame. The school is laid first and the ribbons that start near the middle next, so most run edge to edge. Towards the left edge the field turns less, and the current enters almost level.
