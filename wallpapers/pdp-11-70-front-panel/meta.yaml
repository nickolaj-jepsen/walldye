title: PDP-11/70 front panel
description: The PDP-11/70 front panel groups its lamps in threes because DEC wrote the machine's 16-bit words in octal.
alt: Rows of lamps bracketed in groups of three sit over a row of paddle switches, and the RUN lamp at top left is on.
notes: |
  The address lamps and the switch row both hold 17777707, and the data lamps hold 012700, which a PDP-11 reads as the instruction MOV #n, R0. The data word is 16 bits wide, so its top six sockets stay empty.
