title: Domino run
description: A toppling chain of dominoes moves as a wave whose speed depends on the pieces' width, height and spacing.
alt: Dominoes in a curving row recede in perspective, lying flat at the near left, standing at the far right, with one tipping in between.
notes: |
  Each domino is a box seen through a pinhole camera. Its faces take one of three tones by how squarely they meet the light, and the pieces are drawn from the farthest to the nearest over the shadows they cast on the floor.
technique: [flat]
subject: [physics]
