title: Domino run
description: A wave runs down a curving line of flat-shaded dominoes. The first piece and one caught mid-fall are picked out.
notes: |
  Each domino is a box seen through a pinhole camera. Its faces take one of three tones by how squarely they meet the light, and the pieces are drawn from the farthest to the nearest over the shadows they cast on the floor. Fallen pieces rest almost flat, and the six at the wavefront lean over at steps from 66 to 7 degrees.
technique: [flat]
subject: [physics]
lineage: []
sources:
