title: Spelunky dark level
description: One wall torch lights a Spelunky level in pixel art, showing only the blocks, ladder and back wall inside its dithered circle.
notes: |
  The two rooms follow layouts from the Mines room generator in the *Spelunky Classic* source, with each chance block settled: a main room on the left, and a side room with a high wall and a ladder on the right. The torch is drawn after the wall torch in *Spelunky 2*.
