title: Sorting wires
description: Insertion sort swaps only neighbors, so a value far from its place takes many swaps.
alt: Thirty-two wires cross one another in short steps, and one wire runs flat along the bottom before climbing diagonally to the top right.
notes: |
  Each wire is one number, drawn at its current place in the list and weighted by its value, so the finished end runs from thin to thick. Swaps that don't share a place are drawn side by side, which turns the run into a wedge of crossings. In the network version a bitonic sorting network makes the swaps, some of them sixteen places long.
