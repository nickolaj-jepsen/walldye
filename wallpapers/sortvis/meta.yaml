title: Sorting wires
description: Thirty-two wires trade places, one swap at a time, until they lie in order from thin to thick. One wire's long climb is picked out.
notes: |
  Each wire is one number, drawn at its current place in the list and weighted by its value, so the finished end runs from thin to thick. Insertion sort swaps neighbors only, and swaps that don't share a place are drawn side by side, which turns the run into a wedge of crossings. In the network version a bitonic sorting network makes the swaps, some of them sixteen places long.
