title: Rule 30
description: Rule 30 grows from one cell into a triangle of irregular cells, its random centre column picked out.
notes: |
  Each row is the next generation of the row above: a cell becomes `left XOR (centre OR right)` of the three cells over it. Diagonal stripes run down the left flank, while the rest shows no repeating pattern. Wolfram proposed the centre column as a random number generator, and Mathematica once used it to make random integers.
technique: [simulation, pixel]
subject: [maths]
