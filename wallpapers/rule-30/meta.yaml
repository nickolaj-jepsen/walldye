title: Rule 30
description: Each row of Rule 30 follows from the one above by a fixed rule, yet its center column looks random.
alt: A triangle of small squares widens from one at the top edge, its interior irregular, with a broken vertical line down the center.
notes: |
  Each row is the next generation of the row above: a cell becomes `left XOR (center OR right)` of the three cells over it. Wolfram proposed the center column as a random number generator, and Mathematica once used it to make random integers.
