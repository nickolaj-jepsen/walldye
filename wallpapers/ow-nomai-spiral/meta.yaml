title: Nomai conversation
description: Seven spirals of jagged Nomai script branch across pitted stone, and a translator's trace lights the reply being read.
notes: |
  In *Outer Wilds* the Nomai left their conversations on walls as branching spirals, each reply growing off the line it answers, and the player's translator reads them one line at a time. The spiral shapes and the way replies attach follow the New Horizons mod, which rebuilds the game's own method.
