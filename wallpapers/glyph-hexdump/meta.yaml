title: Hex dump
description: xxd prints a Linux executable's bytes in hexadecimal, each line followed by the same bytes as text.
alt: Rows of hexadecimal bytes beside a column of characters, fading toward the top and bottom, with one name running across two lines selected.
notes: |
  The bytes follow a 64-bit ELF file: its header, one program header, the first instructions of a function, then the names of its sections and symbols.

  On a tall screen the dump shows eight bytes per line instead of sixteen, as `xxd -c 8` prints it.
