title: Hex dump
description: An xxd dump of a Linux executable's first bytes. One string-table name is selected, the cursor just past it.
notes: |
  The bytes follow a 64-bit ELF file: its header, one program header, the first instructions of a function, then the names of its sections and symbols. The selected name breaks across two lines, and the rows around it stand out a little from the rest.

  On a tall screen the dump shows eight bytes per line instead of sixteen, as `xxd -c 8` prints it.
