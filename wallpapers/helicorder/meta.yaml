title: Helicorder
description: Helicorders record ground motion on a slowly turning drum, one row of trace per turn.
alt: Rows of wavering horizontal lines, in one of which a small wave grows into a dense burst that trails into the next row.
notes: |
  The signal is drawn on paper wrapped round a turning drum, so the right end of each row joins the left end of the next. The small breaks mark the minutes.

  An earthquake arrives as a small P wave, and the larger S waves follow.
