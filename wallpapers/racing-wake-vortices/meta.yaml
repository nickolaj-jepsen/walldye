title: Wake vortices
description: The downforce that presses a racing car onto the road also spins the air behind it into vortex pairs.
alt: A square grid of small arrows circles in two rings above the rear of a car outline, with a column of upward arrows between them.
notes: |
  A wing that presses a car onto the road sheds tip vortices that turn the other way from an aircraft's, so the air sinks outside each pair and rises between them. The 2022 Formula 1 rules shaped the rear wing and diffuser around this. Their vortices gather the wake of the rear wheels and throw it upwards in a mushroom shape. By Formula 1's figures, a car ten meters behind another loses 18% of its downforce, against 47% with the 2021 cars.

  The field is modeled. There are two pairs of vortices, one from the rear-wing tips and one from the diffuser, each with the profile of a Lamb-Oseen vortex and a mirror image under the road that keeps the flow running along it. The car is doing 250 km/h, and in the air behind it each vortex is moved by the others' flow, so that five meters back the pair from the diffuser has already risen above the pair from the wing, where the rising column narrows before it spreads. The plot follows particle image velocimetry, which measures flow as arrows of local speed. The car is drawn from behind to the 2022 rules' overall width, diffuser exit and rear wing span.
