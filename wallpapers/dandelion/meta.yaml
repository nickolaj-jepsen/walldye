title: Dandelion clock
description: Six parachutes drift from the bald side of a hairline dandelion clock, the farthest two picked out.
notes: |
  The head holds 260 parachutes spread evenly over a sphere, seen at a slight turn, so those pointing towards or away from you look shorter. Those at the back are thinned out and drawn fainter, and bare stalks mark where the drifting ones broke off.
