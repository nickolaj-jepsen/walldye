title: Dandelion clock
description: Each fruit of a dandelion clock carries a pappus, a tuft of fine hairs that helps the wind carry it.
alt: A round head of fine hairs on a curved stalk is open on its right, and six parachutes rise toward the upper right, growing larger.
notes: |
  The head holds 260 parachutes spread evenly over a sphere, seen at a slight turn, so those pointing toward or away from you look shorter. Those at the back are thinned out and drawn fainter.

  The hairline look comes from Karl Blossfeldt's close-up plant photographs in *Urformen der Kunst*.
