title: Sprite sheet
description: A PICO-8 sprite editor with a campfire enlarged on its grid, the only lit sprite on a half-filled sheet.
notes: |
  Past the hand-drawn tiles and items, the gaps fill with random mirrored creatures that thin out towards the lower right, like a sheet still being worked on. The eight squares in the bar under it are the sprite's flags, as in PICO-8's own editor.
