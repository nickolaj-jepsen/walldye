title: Torchlit cave
description: One torch lights a Minecraft cave in cross-section, the air a level dimmer per block.
notes: |
  In *Minecraft*, block light spreads by flood fill: a torch gives level 14, and every block of air it crosses takes one level off. Open cells show the back wall a block deeper, in its own shadow. The rock is deepslate with three blocks of redstone ore, drawn pixel by pixel after the game's textures.
