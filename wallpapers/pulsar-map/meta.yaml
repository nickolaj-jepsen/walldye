title: Pulsar map
description: Lines on the Pioneer plaque point from the Sun to pulsars, each tick-marked with the pulsar's period in binary.
alt: Lines of different lengths fan out from a dot, each ending in a run of ticks; the longest runs straight right toward two linked circles.
notes: |
  The plaques carried by Pioneer 10 and 11 count each period in units of the hydrogen hyperfine transition, about 0.7 nanoseconds. The two linked circles by the end of the long line are the plaque's hydrogen symbol, which defines that unit.

  Here a tick across a ray is a 1 and a short dash along it is a 0. The ray lengths are set for the composition, where the plaque's give relative distances, and the rays to the Crab pulsar and its near neighbor are spread five degrees apart so both can be seen.
