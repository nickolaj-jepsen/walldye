title: Tree rings
description: A tree adds one ring a year, wide in wet years and narrow in drought.
alt: Closely spaced rings of a felled trunk fill the left, one ring in a different tone, and a thin crack runs in from the bark.
notes: |
  Ring widths narrow with age and swing with a slow climate cycle. The ring in a different tone is a fire year, since studies date past wildfires from the scar a fire leaves in that year's ring.

  The crack is a drying check. Wood shrinks more around the rings than across them, so the end of a log splits in from the bark as it dries.
