title: Open-wheeler elevation
description: A 2022-era Formula 1 car dimensioned in side elevation, with a detail cut through its rear wing.
notes: |
  The body follows side-on photos of the Ferrari F1-75 and the Mercedes W13, two of the first cars built to the 2022 rules, which brought ground effect back to Formula 1 along with 18-inch wheels. Every wing element is a NACA four-digit section, turned upside down so it presses the car onto the track. Dimensions are in millimetres, and the streamlines in detail A are sketched rather than simulated.
