title: Hat tiling
description: Hat tiles cover the screen without repeating. In one filled cluster of 25, the three mirror-image hats are solid.
notes: |
  The hat, published in 2023 by David Smith, Joseph Samuel Myers, Craig S. Kaplan and Chaim Goodman-Strauss, is a single shape that tiles the plane, but only in patterns that never repeat. Every tiling by the hat needs some hats flipped over, about one in eight here; near the filled cluster those are shaded.

  The pattern is grown by swapping each cluster of hats for a larger cluster, five times over, following hatviz, the code published with the paper. The filled cluster is one of the clusters from the first round.

  The spectre version uses the same authors' second tile, drawn here with straight edges. It covers the plane without any flipped copies; instead about one spectre in nine is turned 30 degrees against the rest, and those are the ones filled and shaded.
