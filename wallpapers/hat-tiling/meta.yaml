title: Hat tiling
description: A single 13-sided tile, the hat, covers the plane in patterns that never repeat.
alt: Outlined tiles of one jagged shape cover the screen, and a shaded cluster at upper left holds three solid tiles, the mirrored ones.
notes: |
  David Smith, Joseph Samuel Myers, Craig S. Kaplan and Chaim Goodman-Strauss published the hat in 2023. Every tiling by it needs some hats flipped over, about one in eight here.

  The pattern is grown by swapping each cluster of hats for a larger cluster, five times over, following hatviz, the code published with the paper. The shaded cluster is one of the clusters from the first round.

  The spectre version uses the same authors' second tile, drawn here with straight edges. It covers the plane without any flipped copies; instead about one spectre in nine is turned 30 degrees against the rest.
