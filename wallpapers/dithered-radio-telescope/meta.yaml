title: Dithered radio telescope
description: 'A radio dish in Atkinson dither, which spreads each pixel''s rounding error over six neighbors.'
alt: Tilted on a braced frame, a radio dish stands over speckled ground under a plain sky, with a small light where its struts meet.
notes: |
  Only six eighths of the error is passed on, so the faintest tones come out empty. The original Macintosh used this dither.
