title: Seigaiha
description: Seigaiha wave scales stack up from the bottom and shed their inner rings at a ragged surf line.
notes: |
  Seigaiha is a Japanese wave pattern of concentric arcs, each row covering the lower half of the one behind it. In Japan it goes back to a haniwa figure from Gunma and was worn on Heian court robes.

  Here the rows are laid from the bottom up, and a scale stays only if both scales it rests on stayed, so no crest floats. Scales near the surf keep fewer rings.
