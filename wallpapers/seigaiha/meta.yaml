title: Seigaiha
description: Seigaiha is a Japanese wave pattern of concentric arcs stacked so that only the upper part of each set shows.
alt: Scales of concentric arcs overlap in rows from the bottom up to an uneven top edge, with a pyramid of three scales right of center.
notes: |
  Here the rows are laid from the bottom up, and a scale stays only if both scales it rests on stayed, so no crest floats. Scales near the ragged edge keep fewer rings.
technique: [tiling]
