title: Sunspot
description: Tapered filaments radiate from a lobed umbra split by a thin bridge, among granules that fade toward the limb.
notes: |
  The granule centres are a Poisson-disc sample. Around the spot the cells are stretched outward along its radius, and towards the limb they are squeezed as if drawn on a sphere turning away, then faded into the lanes between them.
