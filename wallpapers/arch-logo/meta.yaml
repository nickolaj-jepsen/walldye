title: Arch logo
description: The Arch Linux logo is an A with slightly curved sides, an arched base and a notch in each leg.
alt: The Arch Linux A inside a dash-dot circle, with dimension lines beside it and guide lines past its corners; the peak is solid.
notes: |
  The letter's corners and arc centers sit on a grid of 48 squares across the base, measured off the official artwork. The flanks curve in very slightly: each is an arc eight to ten times the letter's width in radius. The base is a pointed arch of two arcs, each drawn from a center on the far side of the axis, 61 squares below the letter. Each notch is cut between two arcs that meet at its tip. The upper arc of the left notch, continued across the letter, marks off the peak. The opening is an ellipse 11 squares wide and 18 tall. Carried on through the letter, the left base arc comes out at the notch on the right.
