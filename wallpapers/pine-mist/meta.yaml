title: Pine mist
description: Five pine-crested ridges fade into mist, and a sun sinks halfway behind the farthest, bare hill.
notes: |
  Each ridge is one flat shape: a crest traced from smooth noise, merged with its pines and shaded lighter towards its foot, where mist gathers before the next ridge. A coarser noise decides where pines grow, and any stand of fewer than five trees is cleared. The stepped, flat layers follow Olly Moss's key art for *Firewatch* (2016).
