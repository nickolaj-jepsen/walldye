title: Routes from Copenhagen
description: Flights from Copenhagen follow great circles, which curve toward the pole on a flat map.
alt: Fine curves fan out from Copenhagen over a dotted world map, and one heavier line runs to Singapore.
notes: |
  Routes and airport positions come from OpenFlights. Its route list stopped being updated in June 2014, so this is Copenhagen's network as it stood then. Land is Natural Earth's 1:50m outline, simplified, and sampled on a grid of dots.

  The map uses Miller's cylindrical projection, which stretches distances toward the poles.
