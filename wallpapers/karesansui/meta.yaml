title: Raked garden
description: Rake lines in gravel bend around a pair of stones and a lone one, which is lit.
notes: |
  Karesansui is the Japanese dry landscape garden, with rocks set in gravel raked into lines and ripples. Here the straight lines follow the streamlines of smooth flow past a cylinder, one cylinder per stone, so they bend around the stones without crossing. Many of them stop a rake's width short of the outermost ring instead of wrapping around it.
