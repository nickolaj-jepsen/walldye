title: Raked garden
description: Straight rake lines stop against rings raked round a pair of stones and a lone one, which is lit; lines that would graze a ring bow past it.
notes: |
  Karesansui is the Japanese dry landscape garden, with rocks set in gravel raked into lines and ripples. Here each stone has its own rings, spaced like the rake's tines, and one more ring wraps the pair. The straight lines keep that spacing and end at the outermost ring; the few that would only graze it bow over or under instead, then ease back to straight. In the waist between the pair, short lines follow the shared ring and stop against the inner ones.
