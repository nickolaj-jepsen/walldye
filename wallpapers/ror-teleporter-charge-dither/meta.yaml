title: Teleporter charge
description: A Risk of Rain 2 teleporter charges on a dithered night plain inside a dome of dots. The objective reads 73%.
notes: |
  In *Risk of Rain 2*, starting the teleporter raises a translucent dome about 120 metres across, and players must hold out inside it while the charge climbs to 100%. The objective panel in the top right corner counts the charge.
