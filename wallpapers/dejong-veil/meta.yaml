title: De Jong veil
description: Sixty million points of Peter de Jong's attractor, binned into six tones, curl into a shell. Its densest fold is lit.
notes: |
  Peter de Jong's map moves a point to `x' = sin(a y) - cos(b x)`, `y' = sin(c x) - cos(d y)`. Four hundred thousand random starting points take 170 steps each, and every position after the first twenty is counted on a grid. The counts are smoothed on a log scale and cut at fixed levels, so the edge of each step follows a fold. The shell uses a = -2, b = -2, c = -1.2 and d = 2, one of the sets on Paul Bourke's page.
