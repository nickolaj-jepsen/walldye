title: Kintsugi
description: A bowl from above, three cracks mended with lacquer seams that swell where two meet. A chip in the rim is filled solid.
notes: Kintsugi is the Japanese craft of mending broken pottery with urushi lacquer dusted or mixed with powdered precious metal, so the repair stays in view.
