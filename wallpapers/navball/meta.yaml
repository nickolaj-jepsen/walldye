title: Navball
description: A spacecraft navball tilted on all three axes. Its grid splits into sky and ground behind the lit aircraft symbol.
notes: |
  On crewed spacecraft the attitude indicator is a ball that turns behind a fixed aircraft symbol, showing pitch, roll and yaw against a frame fixed in space rather than the ground. This one is an orthographic projection of its latitude and longitude lines, pitched 25 degrees, rolled 18 and yawed 30.
