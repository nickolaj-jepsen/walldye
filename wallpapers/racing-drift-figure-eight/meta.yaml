title: Figure-eight drift
description: Twenty laps of a car drifting figure eights round two cones, as tyre marks seen from above. The marks it laid last are lit.
notes: |
  The marks come from a simulation of a car held sideways through each loop, built to the wheelbase (2400 mm), track (1355 mm front, 1345 mm rear) and 185 mm tyres of a Toyota AE86. The car points about 36 degrees into each circle, so its rear tyres run on wider circles than the fronts and slide at more than 40 degrees to their direction of travel. The fronts, steered against the turn, roll and leave only faint marks. A tyre sliding at an angle wipes its contact patch sideways, so its mark comes out wider than its tread.

  Through the crossover the body swings from one side to the other, and the rear marks step across. Each lap the driver circles a little wider or tighter, and the marks build up where more laps overlap. The lit marks are the last 22 metres, from the far side of the second loop through the final crossover.
