title: Dithered gas giant
description: A banded gas giant in Stucki dither fills the lower right. Under its one lit belt, a storm oval is flecked with grain.
notes: |
  The bands are a sine of latitude, roughened by value noise stretched along them and strongest at the band edges. The storm swirls those sampling coordinates inside an ellipse, and the disc dims toward its limb.
