title: Blinkenlights
description: Lamp rows over paddle switches, after the PDP-11/70 front panel. RUN is on, and the data row holds 012700.
notes: |
  The address lamps and the switch row both hold 17777707, and the data lamps hold 012700, which a PDP-11 reads as the instruction MOV #n, R0. Lamps are bracketed in threes because DEC wrote PDP-11 words in octal. The data word is 16 bits wide, so its top six sockets stay empty.
