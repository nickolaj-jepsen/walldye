title: Debian swirl
description: The curve of the Debian swirl follows ten circular arcs that meet without a kink.
alt: A swirl cut into ten arcs, each run on as a faint full circle, with radius and angle dimensions beside the filled tail.
notes: |
  The outline is the official artwork's, untouched apart from the cuts between arcs. Ten arcs that meet without a kink follow its center line. After the first, each turns through 60 degrees, and every radius is a whole number of units in the original file, so the centers form a small spiral whose sides turn 60 degrees too. Each circle touches the next where the swirl is cut, and the cuts on the outer turn run on as guide lines.
