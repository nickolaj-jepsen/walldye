title: Dragon quartet
description: 'Four Heighway dragons pinwheel from one point: three in faint outline, the fourth filled in.'
notes: |
  Fold a strip of paper in half ten times, open every crease to a right angle, and its edge traces a Heighway dragon of 1,024 steps. Here each step becomes a small square with the step as its diagonal. Four copies, each a quarter turn from the next around their shared start, fit together without overlapping.
