title: Folds
description: Four ribbons sweep up from the lower left, shadowing one another. The top one turns over, its underside filled in.
notes: |
  The twist turns the top ribbon about its centre line: its width follows the cosine of the turn, and each stretch between two edge-on points gets its own gradient, lit from the upper left.
