title: Rippling rows
description: Level lines fill the lower screen, rippling faster towards the right edge, their crests leaning. One line is picked out.
notes: |
  Takes from Bridget Riley's *Fall* (1963) the idea of one wavy line repeated until its tightening waves start to move.

  Here the lines lie flat and quicken towards the right, and each one lags a little behind the one below it, so the crests lean instead of stacking.
