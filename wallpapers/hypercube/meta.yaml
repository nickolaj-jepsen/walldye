title: Hypercube
description: A six-dimensional cube projected flat, its 192 edges forming a twelve-sided figure. One shortest path is lit rim to rim.
notes: |
  Each of the cube's axes becomes a direction on the page, the directions spread evenly over half a turn, and each corner lands at the sum of all of them, each added or subtracted by that corner's coordinates. This is the Coxeter-plane projection, and its outline has two sides per dimension. The picked-out path changes one coordinate per edge and never changes one back, so no route between its ends is shorter. Since 1973 Manfred Mohr has generated his drawings from hypercubes; his *space.color* series, begun in 1999, is built on the six-dimensional one.
