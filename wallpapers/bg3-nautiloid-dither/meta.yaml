title: Nautiloid over Avernus
description: A mind flayer nautiloid dives bow-first through banded haze, smoke trailing from one burning breach.
notes: |
  The silhouette and the light along its hull and tentacles are traced from the official render of the nautiloid, the mind flayer ship seen over Avernus in the opening of *Baldur's Gate 3*. The shell's coil, growth ribs and straps are computed rather than traced.
