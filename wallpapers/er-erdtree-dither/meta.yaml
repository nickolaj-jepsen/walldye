title: Erdtree over Limgrave
description: The Erdtree over Limgrave in dithered cells, its twisted trunk lit from within. Stormveil and a ruined aqueduct stand in the mist.
notes: |
  The scene follows the view of the Erdtree across Limgrave in *Elden Ring*, with Stormveil Castle on its cliff to the west, a ruined aqueduct in between and a crowned tower before the trunk. The castle and ruins are placed by hand; the strands of the crown grow at random from the fork of the trunk.
