title: Sand spline
description: Strands of dashes drawn along wandering curves pile up into bands of fine grain.
alt: Five wide ribbons of grainy dots run across the screen from left to right; the middle one swells into a broad arch right of center.
notes: |
  After Anders Hoff's *Sand Spline*. Each strand is a smooth curve through a handful of nodes, and the walk pushes hardest right of center.
