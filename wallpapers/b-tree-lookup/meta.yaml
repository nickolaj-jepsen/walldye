title: B+-tree lookup
description: 'Finding a key in a B+-tree reads one node per level, from the root to a leaf.'
alt: A tree of numbered boxes in three rows, with a line from the top box through one middle box to the solid box holding 417.
notes: |
  In a B+-tree every key sits in a leaf, and the leaves are linked in order so a range scan can walk along them. The nodes above hold only separating keys, which tell a search which pointer to follow at each level. The two-character codes under the leaves stand for the records the keys point to.
