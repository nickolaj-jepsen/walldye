title: Dürer's square in dots
description: Dürer's magic square with each number counted out in dots, joined from 1 to 16 by one lit line. The 15 and 14 of the bottom row are picked out.
notes: |
  Joining the numbers of the square in order with one line is an idea from Vera Molnár's plotter drawings. Here each cell also holds its number as a count of dots, so every row, column and diagonal carries the same 34 dots, and the bottom row's middle pair gives the year the square was engraved, 1514.
