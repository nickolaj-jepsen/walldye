title: Dürer's magic square
description: Dürer's magic square from Melencolia I, joined 1 to 16 by one lit line among forty looser retracings.
notes: After Vera Molnár's *Hommage à Dürer*, a series that joins the numbers of the square in Dürer's *Melencolia I* in ascending order with one line. Every row, column and diagonal of the square adds up to 34.
