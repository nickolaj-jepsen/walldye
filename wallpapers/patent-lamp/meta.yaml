title: Patent lamp
description: An incandescent lamp lights when current heats its filament, which Edison's patent made of carbon.
alt: A light bulb with a screw base and a looped filament, ruled shading down its right side and four leader lines ending in small circles.
notes: |
  Patent drawings shade with ruled lines instead of tone. The ruling closes up toward the side in shadow, a heavier shade line runs along the lower right edge of the glass, and the insulator under the screw thread is ruled solid. The glow round the filament is three offset outlines, each stopping higher than the one inside it and breaking into dashes at its ends.
technique: [drafting, stipple]
subject: [machines]
