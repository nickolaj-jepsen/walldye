title: Paper tape
description: Eight-hole paper tape rises across the screen and loops once. Fourteen punched rows are lit just before the loop.
notes: |
  The holes are ASCII as a Teletype Model 33 punched it: seven data bits and an even parity bit across eight channels, with the small feed holes between the third and fourth. The lit rows read NIXOSNIXOS between pairs of rubouts, the character that punches every hole. The rows around them spell a NixOS rebuild command, and the long ends carry feed holes only, like a tape's leader and trailer.
