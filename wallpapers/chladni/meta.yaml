title: Chladni figure
description: 'Sand marks the still lines of a vibrating plate: two diagonals and a ring of small loops around a lit one.'
notes: |
  Ernst Chladni bowed the edges of sand-covered plates and drew the figures the sand made where the plate stood still. This plate follows a common approximation for a square plate, cos(nπx) cos(mπy) − cos(mπx) cos(nπy), where n and m count half-waves across it. When both are odd the diagonals and midlines always stay still, and a larger pair sounds a higher note.
