title: Eddies in a field of strokes
description: Randomly turned short strokes fill a grid with five clearings, and the strokes at each rim swing round it. In the largest clearing, fourteen lie parallel.
notes: |
  The field takes the idea of Vera Molnár's *Interruptions*: a grid of equal lines, each turned at random, with patches left empty. Here the clearings pull on their surroundings. A stroke at a rim lies along it, and the pull fades over the next row or two, so each clearing sits in a faint eddy. Inside the largest, a small block of strokes lies parallel.
