title: Interruptions
description: Randomly turned short strokes fill a grid with five clearings. In the largest, fourteen lie parallel.
notes: |
  Vera Molnár's *Interruptions* series (1968–69) starts from a grid of straight lines of equal length, each turned at random, then erases the lines in random patches. This version keeps the grid and the erased patches, and sets a small block of parallel strokes inside the largest one.
