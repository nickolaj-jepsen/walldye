title: Ear-reddening move
description: Move 127 of Shusaku and Gennan's 1846 Go game is said to have made Gennan's ears flush.
alt: Solid and hollow stones crowd the right of a Go board and thin out toward the left; the stone near the center is move 127.
notes: |
  The story comes from a doctor who watched the game. Shusaku, playing first, won by two points. The board shows the stones left after move 127, with captured groups removed.
