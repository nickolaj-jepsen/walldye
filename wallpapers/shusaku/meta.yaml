title: Ear-reddening move
description: Shusaku and Gennan's 1846 game replayed to move 127, the ear-reddening move picked out near the centre.
notes: |
  A doctor watching the game is said to have seen Gennan's ears flush when Shusaku played move 127, and it has been called the ear-reddening move ever since. Shusaku won by two points.
