title: Paris to Lyon by train
description: "One day's trains on the old Paris–Lyon line as a graphical timetable: each diagonal a train, each flat a stop, one through train picked out."
notes: |
  Stations are ruled across the chart at their real distance along the line, Paris at the top and Lyon at the bottom, and the day runs from before four in the morning to past midnight. A train is a line whose slope is its speed; where it stops, the line runs flat for as long as it waits.

  The trains are the real timetable for Tuesday 13 October 2026: every regional, intercity and high-speed train SNCF runs on this line that day, from its open timetable data. High-speed trains that run between Paris and Lyon on their own line are left out, as are buses. The picked-out train leaves Paris Bercy at 15:35 and runs the whole length to Lyon Part-Dieu, with a 24-minute wait at Dijon. The kilometre posts are the line's own, from French Wikipedia.

  Étienne-Jules Marey printed a graph of this kind for the same line in *La méthode graphique* (1885), crediting it to the engineer Ibry. This one keeps its layout and draws today's trains.
