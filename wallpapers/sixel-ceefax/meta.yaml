title: Teletext sunset
description: A sunset built from teletext's graphics characters, each a 2 by 3 grid of blocks.
alt: Two stepped ridges of small separated blocks stand left of a half-sunk sun on a dashed horizon, with short bars below it as its reflection.
notes: |
  In separated mode every block keeps a gap around it. A character cell can show only one color of block, so wherever the two ridges share a cell, the nearer ridge takes all of it. The BBC's Ceefax service drew its pages under these rules from 1974 to 2012.
