title: Penrose tiling
description: Thin and thick rhombs tile the screen without repeating, filled in three fading rings around one five-rhomb star.
notes: |
  Roger Penrose found these tile sets in the 1970s: pairs of shapes that cover the plane, but only in patterns that never repeat. Here the rhombs are grown by cutting a wheel of triangles into smaller triangles again and again, then joining the halves back into rhombs, following Jeff Preshing's walkthrough.

  The kites and darts version cuts the same triangles once more and joins them along different sides, which turns the rhombs into Penrose's other tile set.
