title: Penrose tiling
description: Penrose tiling covers the plane with two rhombs, in a pattern that never repeats and has five-fold symmetry.
alt: Thin and thick rhombs tile the screen, with a five-pointed star of rhombs right of center surrounded by rings of solid tiles.
notes: |
  Roger Penrose found these tile sets in the 1970s. Here the rhombs are grown by cutting a wheel of triangles into smaller triangles again and again, then joining the halves back into rhombs, following Jeff Preshing's walkthrough.

  The kites and darts version cuts the same triangles once more and joins them along different sides, which turns the rhombs into Penrose's other tile set.
