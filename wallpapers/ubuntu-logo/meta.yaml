title: Ubuntu logo
description: Ubuntu's logo, the Circle of Friends, is three heads in a broken ring.
alt: Three round heads sit in a broken ring, the lowest in a different tone, within construction circles, dash-dot axes and dimension lines.
notes: |
  Every radius in the mark is a whole number of one small unit, measured off the official 2022 artwork: the ring runs from 27 to 36, the head centers sit on a circle of 30, the heads have a radius of 11, and a cut of 16 round each head breaks the ring. In the official file the heads sit slightly off an even spacing; here they are exactly 120 degrees apart.
