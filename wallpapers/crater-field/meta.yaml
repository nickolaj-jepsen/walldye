title: Crater field
description: Craters pock a lunar plain lit low from the left. One young crater throws broken rays across the rest.
notes: |
  Crater sizes follow a power law: each time the size doubles, a quarter as many craters are at least that big. The larger ones are drawn one at a time, so a younger crater cuts through the rim of an older one it lands on. One plain away from the young crater keeps only a scatter of small ones, like a mare flooded by lava.

  The rays are modelled on those around Tycho. They bunch in a few directions, vary in length and break into separate streaks further out.
