title: ASCII donut
description: A spinning torus in twelve ASCII characters, from dots on its shaded underside to at-signs where the light hits the rim.
notes: |
  After Andy Sloane's *donut.c*, the obfuscated C program that spins a torus in a terminal. As in that program, every point on the surface is projected onto the character grid, the nearest point in each cell wins, and the angle between the surface and the light picks one of the characters `.,-~:;=!*#$@`. A second, tighter highlight puts the glint on the outer rim.
