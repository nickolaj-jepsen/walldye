title: ASCII donut
description: A torus tipped steeply and leaning to one side, drawn in twelve ASCII characters, from dots on its shaded side to at-signs where the light catches its rim.
notes: |
  The technique is the one Andy Sloane's *donut.c* made famous: every point on the surface is projected onto the character grid, the nearest point in each cell wins, and the angle between the surface and the light picks a character. This torus doesn't spin. It is tipped nearly on edge and leans in the frame, shaded with its own ramp, `` .`-:;+=*o%#@ ``, and a second, tighter highlight puts the glint on the outer rim.
