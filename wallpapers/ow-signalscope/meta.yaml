title: Signalscope
description: Outer Wilds' signalscope locked onto Riebeck's banjo, a ring on the signal and its waveform beneath.
notes: |
  In *Outer Wilds* each traveller plays one instrument, all of them the same campfire song, and the signalscope tunes in to them across the solar system. The lens, zoom arc, lock ring and readouts are scaled from an in-game capture of the zoomed display, with the distance to the source under the lock ring and the frequency above the waveform. The waveform itself is drawn from noise rather than traced.
