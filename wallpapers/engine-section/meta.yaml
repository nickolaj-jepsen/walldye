title: Engine section
description: A single-cylinder engine in hatched section at top dead center. A spray of dots lights the chamber under the spark plug.
notes: |
  Drawn to drafting conventions: surfaces the cut passes through are hatched, hidden edges such as the head studs and the main journal are dashed, and axes are dash-dotted. The valves, connecting rod and crank web lie behind the cut and are left unhatched. A phantom line marks where the piston crown sits at the bottom of its stroke, closing the stroke dimension.
