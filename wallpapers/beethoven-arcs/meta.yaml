title: Four-note rings
description: Thirteen rings of arcs circle a filled dot, each playing three short notes and a long one, a beat later than the ring inside. One long note is lit.
notes: |
  Takes the segmented rings of Josef Müller-Brockmann's *Beethoven* poster (1955).

  Each ring here is one bar over a three-quarter turn, three short notes and a long one, started a beat later than the ring inside it, so the rests wind outward instead of lining up.
