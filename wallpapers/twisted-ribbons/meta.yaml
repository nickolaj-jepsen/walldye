title: Twisted ribbons
description: A flat ribbon that twists about its center line looks narrowest where it is edge-on.
alt: Four wide ribbons curve up from the lower left, each shadowing the next; near the middle the top ribbon twists to show its underside.
notes: |
  The top ribbon's width follows the cosine of its turn, and each stretch between two edge-on points gets its own gradient, lit from the upper left. The layered ribbons are modeled on Microsoft's Bloom wallpaper for Windows 11.
