title: Movement in squares
description: A three-row checkerboard squeezes into slivers at a fold right of centre, where the thinnest columns are lit.
notes: After Bridget Riley's *Movement in Squares* (1961), in which the squares of a checkerboard keep their height while their columns narrow towards one line, so the flat grid appears to fold. This version keeps three rows, with columns that go from full squares at the ends to slivers at the fold.
