title: Two folds
description: A four-row checkerboard narrows into slivers at two folds, one shallow and one deep. The thinnest columns, at the deeper fold, are lit.
notes: |
  Borrows the folding checkerboard of Bridget Riley's *Movement in Squares* (1961), where columns narrow towards one line so the flat grid seems to bend.

  This frieze has four rows and two folds, a shallow one on the left and a deep one on the right, with full squares between them.
