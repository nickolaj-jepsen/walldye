title: Game of Life glider
description: A glider in Conway's Game of Life moves one cell diagonally every four generations.
alt: Clusters of square cells fill the left half, and at the upper right one five-cell shape has three fainter copies behind it.
notes: |
  A random soup of cells ran for 1,500 generations of Conway's rules. Anything still changing was then cleared, which leaves still lifes and blinkers, and only the largest cluster was kept. The glider's echoes show where it was 12, 24 and 36 generations earlier.
