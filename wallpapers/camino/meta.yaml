title: Camino weave
description: A zigzag road of lit triangles climbs a fringed weave of half-square chevrons.
notes: After Anni Albers' gouache *Study for Camino Real* (1967), made for a wall hanging in the Camino Real Hotel. About one cell in ten turns its diagonal the other way and is picked out one step stronger.
