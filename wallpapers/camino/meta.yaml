title: Zigzag runner
description: A table runner hangs over the table at its two ends, and this one is woven from triangles.
alt: Small triangles fill a rectangle with fringe lines at both ends, crossed by a stepped road that rises and falls twice.
notes: |
  Anni Albers's *Study for Camino Real* (1967), a gouache on graph paper, is the source of the triangle cells and the stepped road. Here the cloth lies across as a runner, the road makes a W from one corner, and about one cell in ten turns its diagonal the other way and is drawn one step stronger.
