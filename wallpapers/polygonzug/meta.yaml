title: Axis-parallel walk
description: A line of horizontal and vertical steps tangles inside a square, then escapes through one wall to a filled square.
notes: |
  Georg Nees plotted *Achsenparalleler Irrweg* (axis-parallel maze) in 1964, from an ALGOL program on a Zuse Graphomat Z 64. This walk takes longer strides, and after about 500 steps it leaves by the far wall.
