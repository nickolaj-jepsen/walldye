title: Weather satellite picture
description: NOAA satellites sent weather pictures by radio at two lines a second, drawn top down as the satellite passed.
alt: A framed scan shows a spiral cyclone down to a horizontal line, with sparse static below it and a striped strip at the left.
notes: |
  NOAA's polar-orbiting weather satellites broadcast Automatic Picture Transmission (APT) at 137 MHz, so a ground station draws the picture from the top down while the satellite passes overhead. Each line opens with seven sync pulses, which stack into the striped strip down the left edge; the stepped column on the right is a simplified telemetry wedge.
