title: Telescope ray diagram
description: A Keplerian telescope's two lenses share a focus, which inverts the image and magnifies it by their focal-length ratio.
alt: Rays from a large lens cross at one point and leave a smaller lens parallel, with dimension lines for the two focal lengths below.
notes: |
  The objective is a cemented achromatic doublet: a biconvex crown lens against a plano-concave flint lens. The eyepiece is a single biconvex lens.

  Rays are traced paraxially, so each lens bends them once. Light from a star straight ahead crosses at the shared focus, inside a field stop, and leaves the eyepiece parallel again. Two stars about two degrees off the axis send bundles that cross beside the focus and overlap again at the exit pupil, where the eye would be. They leave nearly three times as steep and tilted the other way, because the image is magnified and upside down.
