title: Cracked pane
description: Glass hit hard cracks in radial lines first, then in rings that join them.
alt: Thin cracks run to every edge from a cluster of solid shards right of center, linked by shorter cracks in rings.
notes: |
  Each long crack is a random walk that turns a little at every step, thinning and fading as it runs out to the edge of the screen. Shorter cracks join neighboring long ones in rings that spread wider each time and sag toward the impact, and a few branches grow off them until they meet another crack. The shards are an irregular star cut apart along the cracks, around a crushed core where some pieces are missing.

  Anders Hoff's Fracture makes fracture-like patterns from randomized starting points; here the cracks radiate from one impact.
