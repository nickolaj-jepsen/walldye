title: Warp ikat
description: Warp ikat dyes bundles of threads before weaving, so the edges of its pattern come out blurred.
alt: Vertical threads form a stepped double diamond with ragged edges at the left; a second, fainter copy is cut off at the right edge.
notes: |
  The dye creeps under the ties, and the threads never line up exactly on the loom.
