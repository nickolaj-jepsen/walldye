title: Warp ikat
description: A stepped double diamond dyed into vertical threads, its edges bleeding bundle by bundle beside a fainter twin.
notes: |
  In warp ikat, bundles of threads are tied and dyed before weaving. The dye creeps under the ties and the threads never line up exactly on the loom, so every edge of the pattern blurs.
