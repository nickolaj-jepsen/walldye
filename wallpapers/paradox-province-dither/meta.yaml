title: Austria in 1444
description: Central Europe on 11 November 1444, dithered province by province as in Europa Universalis IV, with Austria filled in.
notes: |
  Province outlines come from the game's map files by way of paimoe's eu4map, cropped to the stretch from the English Channel to the Adriatic. Neighbouring countries get different dither densities, and Austria keeps its small exclave to the west. The chevrons follow the game's trade-node links, as in its trade map mode.
