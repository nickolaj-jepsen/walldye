title: Fedora logo
description: Every curve in the Fedora logo is a circular arc, so it can be drawn from centers and radii.
alt: A circle with one squared corner holds an f with a solid loop at its foot, with guide lines and dimension arrows around it.
notes: |
  Each part is snapped from the official artwork to a grid whose step is an eighth of the stroke's width. The bubble is a circle 48 steps in radius with its lower-left quarter squared off; the hook and the loop are arcs of 11 and 14 steps, measured to the middle of the stroke. The loop stops half a stroke short of the stem, where the two strands of the infinity cross.
