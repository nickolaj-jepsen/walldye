title: Nautical chart
description: A sea chart gives depth as contour lines and spot soundings, so a mariner can keep to deep water.
alt: A coast with depth contours; a dashed track comes in from open water, crosses a short arc below a lighthouse and ends at an anchor.
notes: |
  The coast is drawn from layered noise, and each depth comes from how far that point lies from land. Depth contours are dashed more finely the shallower they run, and the water inside the second contour carries a faint tint, as printed charts wash their shallows. Soundings are groups of one to three dots, more for deeper water, and they thin out offshore, where charts sound less densely.

  A sector light shows its arc over the safe way in. The track holds the middle of that arc until a waypoint off the headland, then turns for the anchor.
