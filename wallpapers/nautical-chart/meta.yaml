variants:
  default:
    label: Headland and anchorage
  estuary:
    label: Estuary channel
    description: Drying sandbanks fill a river mouth. Buoys mark both sides of the channel that winds between them, and a track follows it in from a lit buoy offshore.
  harbor:
    label: Harbor entrance
    description: The way into a harbor runs straight between the heads of its two breakwaters, on the line of two lights set one behind the other ashore.
  skerries:
    label: Passage through islets
    description: Islets and rocks lie off a mainland shore, their drying ledges fringed with short ticks as charts draw them. A dashed track winds between them to an anchorage.
