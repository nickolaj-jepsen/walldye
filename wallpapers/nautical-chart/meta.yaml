variants:
  default:
    label: Headland and anchorage
  estuary:
    label: Estuary channel
    description: In an estuary, buoys mark the two sides of a channel through sandbanks that dry out at low tide.
    alt: Sandbanks fill a river mouth, with small buoy marks on both sides of a bending line from a marker at the right to an anchor.
  harbor:
    label: Harbor entrance
    description: Two lights, one behind the other, mark a harbor channel, and a ship in line with both stays in it.
    alt: A straight line crosses open water into the gap between two breakwaters, then continues dashed to two markers ashore.
  skerries:
    label: Passage through islets
    description: Skerries are small rocky islets, and a chart draws the ledges around them so a boat can pick a passage.
    alt: Islets fringed with short ticks lie off a mainland shore; a dashed track bends between them from the top left to an anchor.
