title: Graphic score
description: A graphic score writes music as drawn shapes, and Cardew's Treatise filled 193 pages with them.
alt: 'Thin shapes hang on one horizontal line: a staff, a circle, a triangle, a bent staff, and a solid dot inside a ring.'
notes: |
  Cornelius Cardew made *Treatise* between 1963 and 1967 and gave the players no instructions. Through most of its pages runs a nearly unbroken line that Cardew called "the lifeline of the reader".
