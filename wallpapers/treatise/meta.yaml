title: Graphic score
description: 'A graphic score strung along one line: a bisected circle, a triangle, a staff bending upward and one filled note.'
notes: |
  Cornelius Cardew made *Treatise* between 1963 and 1967: 193 pages of lines, symbols and geometric shapes, with no instructions for the players. Through most of its pages runs a nearly unbroken line that Cardew called "the lifeline of the reader". This page hangs its shapes on that line.
