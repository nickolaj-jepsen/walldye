title: Spire map log
description: Slay the Spire's first act logged in text, rooms as letters and paths as slashes. One route is lit to the treasure.
notes: |
  When *Slay the Spire* builds an act, it writes the map to its log as plain text: floor numbers down the left, one letter per room, and slashes and bars for the paths between floors. This map comes from the game's own generation rules, quirks included, and the lit route runs from a starting fight to the treasure rooms halfway up.
