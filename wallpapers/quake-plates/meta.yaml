title: Ring of Fire
description: Fifty years of strong earthquakes, one dot each, trace the plate edges around the Pacific. A ring marks Tōhoku, 2011, the largest of them alongside Sumatra 2004.
notes: |
  Every earthquake of magnitude 5.5 or more from 1976 to 2025 in the USGS catalog, about 23,500 of them, placed at its epicenter on a plain latitude-longitude grid centered on the Pacific. Dots grow with magnitude. The hairlines are plate boundaries from Peter Bird's 2003 model. No coastlines are drawn: the continents show only where they shake.
