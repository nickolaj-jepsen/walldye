title: Cyclone, line by line
description: Line by line, a dithered satellite picture of a cyclone comes in. The line being written is lit above bare static.
notes: |
  NOAA's polar-orbiting weather satellites broadcast Automatic Picture Transmission (APT) at 137 MHz, two lines a second, so a ground station draws the picture from the top down while the satellite passes overhead. Each line opens with seven sync pulses, which stack into the striped strip down the left edge; the stepped column on the right is a simplified telemetry wedge. NOAA-15, the last satellite sending APT, was switched off in August 2025.
