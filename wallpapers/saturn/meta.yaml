title: Saturn
description: A cropped Saturn, whose rings are almost pure water ice.
alt: A cropped Saturn fills the lower right, its globe drawn as latitude arcs and its rings as fine ellipses that fade in the planet's shadow.
notes: |
  The rings keep the proportions of Saturn's real C, B and A rings, with the Encke Gap near the outer edge. The Cassini Division is drawn nearly twice its true width so that it shows at this size, and the globe is flattened at the poles by a tenth, as Saturn is.

  Shading follows the sunlight. Ring lines go faint where they pass through the planet's shadow. On the globe, a point whose line to the sun crosses the dense B or A ring falls into shadow, while the thinner C ring only halves its light, so the lit edge breaks up across the southern half.
