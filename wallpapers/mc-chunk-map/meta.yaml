title: Chunk map
description: Minecraft plains and oak woods by a river, mapped block by block. The player's chunk is marked beside the F3 readout.
notes: |
  The map follows the rules of *Minecraft*. At its closest zoom a map covers 128 by 128 blocks on a fixed grid, and each block is drawn lighter or darker as it stands above or below its neighbour to the north. The paper edge, the arrow and the lettering follow the game's own textures, and the readout is worked out from where the arrow stands, so its block, chunk and region file agree with the map.
