title: Curiosity's route
description: Curiosity's route across Gale crater, from its landing site to its latest stop, over contours every 50 meters as the ground rises toward Mount Sharp.
notes: |
  The Curiosity rover landed on the floor of Gale crater in August 2012 and has since driven about 38 kilometers, climbing a little over 1,000 meters onto the lower slopes of Mount Sharp. The route is NASA's traverse as of its 5,021st Martian day, in September 2026; its last eight kilometers lead to the rover's latest stop. Short out-and-back side trips are left out.

  The contours come from the US Geological Survey's merged elevation model of Gale, built from orbital stereo images and laser altimetry, with a heavier line every 250 meters. Past its edges, the global map from Mars Global Surveyor's laser altimeter fills in. The map is turned so the drive climbs the screen, rising to the right on wide screens and upward on tall ones.
