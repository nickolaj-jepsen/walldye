title: Packet header
description: An IPv4 packet starts with a header of at least 20 bytes, drawn in RFC 791 as 32-bit rows.
alt: IPv4 header fields in rows of pixel text, with a note beside the Time to Live field counting down from 64 to 63.
notes: |
  Every router that forwards an IPv4 packet lowers its Time to Live by at least one and destroys the packet when the count reaches zero, so a packet caught in a routing loop cannot circle forever. The diagram is copied character for character from Figure 4 of the 1981 specification.
technique: [glyph, drafting]
subject: [computing]
lineage: []
