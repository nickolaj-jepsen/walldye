variants:
  default:
    label: IPv4 header
  tcp:
    label: TCP header
    alt: TCP header fields set out in rows of pixel text, with the SYN flag boxed and a note beside it reading SEQ=100, CTL=SYN.
    description: 'TCP opens a connection with a segment that has only the SYN bit set, as in RFC 793''s handshake example.'
  udp:
    label: UDP header
    alt: A short table of UDP header fields, the destination port boxed with 53 written beside it, above a line of data octets.
    description: A UDP header holds four 16-bit fields and nothing else, so it adds only 8 bytes to the data.
  dns:
    label: DNS header
    alt: A DNS header laid out in rows of pixel text, with its first flag bit boxed and a note beside it turning 0 into 1.
    description: A DNS message begins with a 12-byte header whose first bit says query or response.
