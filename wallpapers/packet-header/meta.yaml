title: Packet header
description: RFC 791's IPv4 header diagram in a pixel font, where a note takes the lit Time to Live field from 64 to 63.
notes: |
  Every router that forwards an IPv4 packet lowers its Time to Live by at least one and destroys the packet when the count reaches zero, so a packet caught in a routing loop cannot circle forever. The diagram is copied character for character from Figure 4 of the 1981 specification.
