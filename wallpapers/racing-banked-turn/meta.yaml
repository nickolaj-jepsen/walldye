title: Daytona banking
description: The Daytona oval in plan and one of its turns in section. A lit triangle on one car adds up to a pull towards the turn's center.
notes: |
  The section is drawn to one scale from published figures for the turns at Daytona International Speedway, which opened in 1959. The racing surface is 40 feet wide and banked at 31 degrees, so its outer edge stands about 21 feet above the apron, and each turn has a radius of 1,000 feet. The apron is given as 12 to 30 feet wide and is drawn at 20. Since 2004 the outside wall in the turns has carried a barrier of rectangular steel tubing backed by foam blocks, and since 2010 the catch fence on top of the wall has stood 22 feet high, its steel cables crossing the section as dots. The heights of the wall and barrier, and the number of cables, are estimates.

  The car is seen from behind. The track pushes on it square to the surface, so the push leans towards the infield by the banking angle. Added to the car's weight, it leaves a level force pointing at the center of the turn, along the dash-dot line. The triangle is to scale: the push is 1.17 times the weight and the level force 0.6 times it, enough to hold a car in the turn at about 95 mph with no grip from the tires. Race cars take the turn at nearly twice that speed, and there the tires' grip down the slope supplies more than half of the pull.

  The plan of the oval is traced from OpenStreetMap, and its turns measure the published 1,000 feet in radius. It marks where the section cuts across the bend of the first and second turns, with arrows looking the way the cars run. In the plan, the dash-dot line carries on through the cut to the center of that turn. The plan is drawn at a far smaller scale than the section, and its track is widened so it can be seen.

  The banks were built from soil dug out of the infield, and the hole filled with groundwater to become Lake Lloyd.
