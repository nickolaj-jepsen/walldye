title: Bamboo grove
description: Bamboo is a grass, and its hollow stalks are closed off at every node.
alt: Tall bamboo stalks with tapered leaves fill the left third of the screen, with a low sun shining on one stalk partway back.
notes: |
  East Asian ink bamboo painting, redrawn in flat shapes. Each stalk swells a little at its nodes, the joints along it, and each leaf is a tapered strip hung from a short twig. The low sun on one stalk comes from Kawase Hasui's shin-hanga prints.
