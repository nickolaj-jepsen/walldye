title: Bamboo grove
description: Nine bamboo stalks crowd the left edge, fainter the farther back they stand. One in the middle row is lit.
notes: |
  A take on East Asian ink bamboo painting in flat shapes. Each stalk swells a little at its nodes, and each leaf is a tapered strip hung from a short twig; a leaf from a front stalk reaches across the lit one. The late sun on that stalk nods to Kawase Hasui's shin-hanga landscapes.
