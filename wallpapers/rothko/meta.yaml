title: After Rothko
description: 'Stacked on bare ground: a large block, a thin band and a wider, shallower block, streaked by long brush strokes.'
notes: Suggested by the stacked, soft-edged rectangles in Mark Rothko's paintings of the 1950s. Each edge fades through nested outlines that drift slightly, so the fade is tight in places and loose in others.
