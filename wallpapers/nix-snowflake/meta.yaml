title: Nix snowflake
description: The NixOS snowflake as a construction drawing, its lambdas' edges run on as guide lines and one lambda filled in.
notes: |
  Each lambda is snapped to a triangular lattice at one sixth of the bar width, and the six are turned 60 degrees apart around a hexagonal opening, keeping the narrow seams of the official artwork between them. Inside the dash-dot circle, a guide line is drawn only where it leaves the end of a bar or frames the opening, so the pockets between the bars stay clear.
