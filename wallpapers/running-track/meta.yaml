title: Running track
description: An eight-lane track from above. The 200 m in lane four is lit from its staggered start to the finish.
notes: |
  Drawn to the measurements of the standard 400 m track: bends of 36.5 m radius, 84.39 m straights and 1.22 m lanes. A 200 m race covers half a bend and the home straight, so each lane starts further round to make up for its longer curve, measured 0.2 m out from the lane's inner line (0.3 m from the kerb in lane one).
