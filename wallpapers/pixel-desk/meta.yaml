title: Desk at night
description: An isometric pixel-art room at night. Only the monitor is on, its light falling across the desk in two dithered steps.
notes: |
  Every edge follows the stair step common in isometric pixel art, two cells across for each cell down, so diagonals stay even. The pool of light is worked out on the plane of the desk top, which keeps it flat in the same projection.
