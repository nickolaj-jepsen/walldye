title: Desk at night
description: A night room in isometric pixel art, where edges run two pixels across for every one down.
alt: A corner room with a four-pane window in the left wall and, at the right, a desk with a monitor showing text and a mug.
notes: |
  The monitor's light is worked out on the plane of the desk top, which keeps it flat in the same projection.
