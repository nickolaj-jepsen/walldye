title: Flow field ribbons
description: Each ribbon follows a path through a flow field, a grid of angles that tells a line where to head.
alt: Ribbons of mixed widths flow across the screen without touching, and a bundle of five, thick to thin, slopes down from the top.
notes: |
  The method comes from Tyler Hobbs's *Fidenza*. Each ribbon is a streamline of a Perlin noise field, grown both ways from its starting point until it comes within a set gap of a neighbor. The bundle of five is laid first with a wider gap around it, then the ribbons that start near the middle, so most cross the whole frame. On narrow screens the bundle shortens and moves inward so both ends stay in view.
