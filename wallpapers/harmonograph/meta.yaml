title: Harmonograph
description: A damped pendulum drawing at two to three. Its loops shrink inward to a few lit turns around an eye with one dot.
notes: Each axis adds two damped swings, as a two-pendulum harmonograph does, and one swing per axis runs slightly fast, so every loop lands a little turned from the last.
