title: Harmonograph
description: A harmonograph pen follows swinging pendulums, and as they lose energy each loop comes out smaller.
alt: Nested thin curves spread into several lobes that converge on a small oval ring holding a single dot.
notes: Each axis adds two damped swings, as a two-pendulum harmonograph does, and one swing per axis runs slightly fast, so every loop lands a little turned from the last.
