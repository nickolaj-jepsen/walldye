title: Tartan
description: A tartan's diagonal ribs come from a 2/2 twill, where the weft passes over two warp threads, then under two.
alt: A plaid of broad and narrow bands crossed by one thin vertical stripe and one thin horizontal stripe, which meet near the top center.
notes: |
  A tartan is written down as a threadcount: the stripes from one pivot to the next, each with its number of threads, which the weaver mirrors at every pivot and repeats in the weft. Here the plain pivot widens on longer screens, so each screen shows one crossing.
technique: [tiling]
