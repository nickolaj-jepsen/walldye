title: Tartan
description: A 2/2 twill tartan, ribbed in every band. One broad check crosses a plain ground, with a lit overcheck at its center.
notes: |
  A tartan is written down as a threadcount: the stripes from one pivot to the next, each with its number of threads, which the weaver mirrors at every pivot and repeats in the weft. Here the plain pivot widens on longer screens, so each screen shows one crossing.
