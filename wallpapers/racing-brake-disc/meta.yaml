title: Carbon brake disc
description: Cooling holes in a Formula 1 brake disc open on its rim into channels that run through it.
alt: A ring-shaped brake disc seen at an angle, its rim perforated by rows of small holes, with a caliper block clamped at its upper left.
notes: |
  The disc is the Very High Cooling front disc that Brembo offered Formula 1 teams in 2020 and 2021: 278 mm across and 32 mm thick, with 1,470 cooling holes 2.5 mm wide in seven rows. Here each row holds 210 holes, and every other row is shifted by half the spacing between holes.

  Brembo gives carbon discs a working range of 350 to 1,000 °C. Heat peaks just past the caliper's trailing edge and falls off as the disc turns on. The figures leave out how the rows are spaced and staggered, the drive tabs round the bore and the caliper's size, so those follow Brembo's photographs.
