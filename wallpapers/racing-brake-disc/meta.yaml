title: Carbon brake disc
description: Seven rows of cooling holes run round the rim of a carbon brake disc. Where the rim leaves the caliper it glows, fading in dithered steps.
notes: |
  The disc is the Very High Cooling front disc that Brembo offered Formula 1 teams in 2020 and 2021: 278 mm across and 32 mm thick, with 1,470 cooling holes 2.5 mm wide in seven rows. Here each row holds 210 holes, and every other row is shifted by half the spacing between holes. The holes are the mouths of radial channels inside the disc, so they show on the rim and not on the faces, and the disc is drawn turned away to show them.

  Brembo gives carbon discs a working range of 350 to 1,000 °C. The heat is drawn strongest just past the caliper's trailing edge and falls off as the disc turns on. The figures leave out how the rows are spaced and staggered, the drive tabs round the bore and the caliper's size, so those follow Brembo's photographs.
