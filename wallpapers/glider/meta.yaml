title: Escaping glider
description: One glider escapes up and to the right from a burnt-out Game of Life soup, three fading echoes behind it.
notes: |
  A random soup of cells ran for 1,500 generations of Conway's rules. Anything still changing was then cleared, which leaves still lifes and blinkers, and only the largest cluster was kept. A glider moves one cell diagonally every four generations, so its echoes show where it was 12, 24 and 36 generations earlier.
