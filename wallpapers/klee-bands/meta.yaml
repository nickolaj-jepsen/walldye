title: Sunset over ruled bands
description: Six buckled bands of ruled and crossed cells, with a sun drawn at six moments as it drops towards them. The last, filled in, sets behind the top line.
notes: |
  The bands take their method from Frieder Nake's plotter drawing *Hommage à Paul Klee 13/9/65 Nr. 2*: each band line is a random walk across the width, cut into cells by verticals, some crossed with diagonals and some hatched. The circles here are one sun, spaced along its path so it drops faster as it nears the bands, and its last position is cut off by the top line.
