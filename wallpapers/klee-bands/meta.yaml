title: Homage to Klee
description: Six buckled bands of ruled and crossed cells run beneath six circles, one of them filled.
notes: After Frieder Nake's *Hommage à Paul Klee 13/9/65 Nr. 2*, a 1965 plotter drawing whose program started from the horizontals and verticals of Paul Klee's *Highway and Byways* (1929). Each band line is a random walk across the width, and each circle either clears the band lines or plainly overlaps one.
