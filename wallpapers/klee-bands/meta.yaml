title: Sunset over ruled bands
description: Bands of ruled cells whose lines are random walks, paths that take each step in a random direction.
alt: Six uneven bands of cells, some crossed, some hatched, with five sun outlines curving down to a filled sun half hidden behind the top band.
notes: |
  The method comes from Frieder Nake's plotter drawing *Hommage à Paul Klee 13/9/65 Nr. 2*: verticals cut each band line into cells, some crossed with diagonals and some hatched. The six circles are one sun at six points on its path, spaced so it drops faster as it nears the bands, and the last is cut off by the top line.
