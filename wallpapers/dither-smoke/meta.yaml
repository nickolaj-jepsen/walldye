title: Dithered smoke
description: 'Incense smoke rises as a smooth thread, then turns turbulent.'
alt: 'A thin column of dots rises from a small square, bends into a loop and spreads into scattered specks; its lower part is denser.'
notes: |
  The plume is four strands of five braided filaments each, spread wider and warped harder by noise the higher they rise. Sierra Lite dithering then turns the tones into dots by passing each cell's rounding error to three neighbors: half to the next cell in the row, a quarter to each of the two beneath it.
