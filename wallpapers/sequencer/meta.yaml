title: Step sequencer
description: A drum machine's eight-by-sixteen step grid, halted on step 11. The muted chord track's hits are hollow.
notes: |
  The kick lands on every beat and the snare on two and four, with one extra hit on the last step. The chord track is muted, so its lamp is lit. On a tall screen the grid takes a tracker's layout, with time running down the screen and one column per track.
