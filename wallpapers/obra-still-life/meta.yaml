title: Plaster still life
description: Plaster cube, cone, sphere and cylinder on a table, ray-cast and dithered under light from the left.
notes: |
  The look follows Lucas Pope's *Return of the Obra Dinn*, which draws its 3D scenes in a dithered one-bit style after early Macintosh games. The solids use an ordered screen over five tone steps, so the light turns across them in even bands, while the table and wall get a finer, irregular grain. On light screens the drawing inks the shadows instead, like a pencil study of plaster casts.
