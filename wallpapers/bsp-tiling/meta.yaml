title: Tiled windows
description: Tiling window managers divide the screen without overlap, opening each new window by splitting the focused one.
alt: Outlined windows shrink as they wind inward from a tall one at the left, ending in a small window holding a few bars of text.
notes: |
  The layout is a spiral scheme: each new window splits the focused one from the next side in turn, so the windows wind in on themselves. The text in the focused window is made up, drawn as bars.
