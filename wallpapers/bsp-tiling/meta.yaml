title: Tiled windows
description: Window outlines spiral inward with even gaps, each cut taking one side of what is left, down to a focused window holding a few lines of code.
notes: |
  The layout follows a tiling window manager's spiral scheme: each new window splits the focused one from the next side in turn, so the windows wind in on themselves. The text in the focused window is made up, drawn as bars.
