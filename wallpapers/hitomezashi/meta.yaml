title: Hitomezashi
description: Hitomezashi is Japanese sashiko stitching in which each row and column is a line of running stitches.
alt: Stepped diamonds of short stitches cover the screen, and one solid shape is a large ring topped by a cross, joined to a small ring.
notes: |
  The only choice per line is whether it starts with a stitch or a gap. Most lines here start opposite to their neighbor, which draws long diagonal steps.
technique: [tiling]
