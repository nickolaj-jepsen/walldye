title: Ferrofluid crown
description: Under a magnet, ferrofluid rises into a crown of spikes, lit along their edges from the right.
notes: |
  A strong vertical magnetic field makes the flat surface of a magnetic fluid unstable, and it settles into a regular pattern of peaks and valleys, known as the Rosensweig or normal-field instability. Here the peaks stand on a hexagonal lattice, tallest at the middle of the puddle.
