title: Pong, mid-rally
description: The arcade Pong was built from logic chips, with no microprocessor.
alt: Along a dotted path that bounces off the top wall, a square ball with a short trail heads from the left paddle toward the right.
notes: |
  The ball leaves the wall at the angle it arrived, both measured from the normal, the line at a right angle to the wall. The drawing marks those angles at the point of contact.

  The paddles, square ball and dashed center line come from Atari's *Pong* (1972). The bounce diagram is added.
