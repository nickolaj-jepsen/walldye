title: Spa mini-sectors
description: Formula 1 live timing splits a lap into three sectors and those into mini-sectors, here on the Spa circuit.
alt: Square dots trace a race circuit beside three sector times and a segmented bar; the climb from Eau Rouge to Les Combes is marked.
notes: |
  Live timing lights up the fastest time through each. The centerline comes from the TUMFTM racetrack database, which took it from OpenStreetMap. The lap and its sector times are made up, though they add up.
