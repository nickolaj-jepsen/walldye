title: Iron filings
description: Iron filings bristle at the ends of a tilted bar magnet and chain from pole to pole.
notes: |
  Faraday fixed patterns like this on waxed paper in 1851. Here each stroke is turned along the field of point poles set just inside each magnet's ends, and the strokes gather on curves where the Stokes stream function is constant.
