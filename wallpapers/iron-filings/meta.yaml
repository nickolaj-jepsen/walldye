variants:
  default:
    label: Bar magnet
  repelling:
    label: Like poles facing
    alt: Two bar magnets lie end to end, each wrapped in its own loops of short dashes, with an empty gap between them.
    description: Facing like poles repel, so the filings between two bar magnets turn aside instead of joining them.
  horseshoe:
    label: Horseshoe magnet
    alt: A horseshoe magnet stands open end up, with short dashes crowded between its two tips and curving out in loops around the arms.
    description: A horseshoe magnet bends a bar into a U to bring both poles close, which strengthens the field between them.
