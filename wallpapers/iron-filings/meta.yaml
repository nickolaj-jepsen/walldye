title: Iron filings
description: Iron filings become tiny magnets and line up along the field lines of a bar magnet.
alt: Short dashes crowd the ends of a small bar magnet and curve in loops from one end to the other, thinning out toward the edges.
notes: |
  Faraday fixed patterns like this on waxed paper in 1851. Here each stroke is turned along the field of point poles set just inside each magnet's ends, and the strokes gather on curves where the Stokes stream function is constant.
technique: [field]
