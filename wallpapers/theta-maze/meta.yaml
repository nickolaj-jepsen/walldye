title: Theta maze
description: In a theta maze, rings split into more cells toward the rim so passages keep about the same width.
alt: A circular maze with a gate at its upper left rim and a path running through the walls to a dot at the center.
notes: |
  A ring doubles its cell count wherever its cells would otherwise grow wider than two ring widths, from 8 cells at the center to 64 at the rim. A recursive backtracker carves the maze from the gate and picks a move around a ring five times as often as one across, which gives long curving corridors.

  The maze has no loops, so the shortest route to the center is also the only one.
