title: Suprematist rectangles
description: Malevich's Suprematism built pictures only from flat geometric shapes, here ten rectangles at one tilt.
alt: Ten tilted rectangles shrink along a rising curve in two staggered rows, the largest at lower left, with a thin line between the rows.
notes: |
  Malevich's *Suprematist Composition: Airplane Flying* (1915) sets flat blocks on a diagonal across an empty ground. Here the diagonal becomes a curve, and on tall screens it turns steeper to climb the long side.
