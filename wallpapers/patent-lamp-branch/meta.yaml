title: Patent lamp
description: A patent-figure lamp whose rulings tighten toward the shadow side. Its filament is lit inside a stippled rim.
notes: |
  The shading follows patent-drawing practice. Vertical rules close up towards the side in shadow, the lower right edge of the glass carries a heavier shade line, and the insulator under the screw thread is ruled almost solid. The glow round the filament is three offset outlines, each stopping higher than the one inside it and breaking into shorter and shorter dashes at its ends.
