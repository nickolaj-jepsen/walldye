title: Roguelike level
description: In a NetHack-style text dungeon, the @ carries a torch through an unlit room, lighting the floor in rings.
notes: |
  The map is split in two again and again, with one room in each piece. Every corridor is the cheapest path between two rooms and reuses earlier corridors and doors where it can. The west of the level is still unexplored, so it stays blank.
