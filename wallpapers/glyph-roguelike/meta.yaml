title: Roguelike level
description: NetHack shows a level with - and | for walls, . for floor and @ for the player.
alt: Six walled rooms drawn in text characters, joined by corridors, all faint except the floor around an @ in the lower middle room.
notes: |
  The map is split in two again and again, with one room in each piece. Every corridor is the cheapest path between two rooms and reuses earlier corridors and doors where it can.
