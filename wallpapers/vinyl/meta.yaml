title: Vinyl record
description: A long-playing record runs off the screen, five tracks of groove spiralling in to a filled label.
notes: |
  The grooves are drawn as separate rings rather than one spiral, each nudged off its spacing by a hair, with wider bands of bare vinyl between the tracks. Past the last track the lead-out groove circles the label three times and ends in the locked groove, the silent loop that keeps the needle off the label.
