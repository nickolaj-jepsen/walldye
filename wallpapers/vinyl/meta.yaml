title: Vinyl record
description: The close spacing of an LP's spiral groove gives it more playing time than older records.
alt: A record fills the right side and runs off the edge, its fine grooves in five bands around a solid label with a center hole.
notes: |
  Here the grooves are separate rings rather than one spiral, each nudged slightly off its spacing, with wider bands of bare vinyl between the tracks. Past the last track the lead-out groove circles the label three times and ends in the locked groove, the silent loop that keeps the needle off the label.
