title: Pendulum wave
description: Eighteen pendulums on a patent-drawing frame swing in an S-curve with ghosts trailing each bob. The two at the crest are lit.
notes: |
  Over one full cycle each pendulum makes one more swing than its neighbour on the left, from 130 to 147, so its length falls as the inverse square of that count. The drawing stops about 7% of the way through the cycle, and the two ghosts behind each bob mark where it was a moment earlier.
