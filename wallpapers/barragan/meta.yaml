title: Barragán walls
description: Barragán's Cuadra San Cristóbal, near Mexico City, is a stable with a pool made for horses.
alt: A long wall with a rectangular doorway has two taller slabs in front of it, above a pool that reflects them in horizontal strips.
notes: |
  Luis Barragán designed the estate with Andrés Casillas in 1966–68, northeast of Mexico City. Here the walls are flat planes, with shadows cast from the upper left.
