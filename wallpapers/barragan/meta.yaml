title: Barragán walls
description: Two tall walls stand before a long one with a doorway. A still pool reflects them in widening strips.
notes: |
  After Luis Barragán's Cuadra San Cristóbal (1966–68) in Mexico City, where a long stucco wall pierced by portals stands over a horse pool. Here the walls are flat planes, with shadows cast from the upper left.
