title: Breaking wave
description: In a plunging breaker the crest steepens, curls over and drops onto the trough.
alt: A wave rises from the left and curls forward over a hollow, with spray flying off its lip above a flat sea.
notes: |
  The curl comes from Hokusai's *The Great Wave off Kanagawa*, without the boats or the mountain. The dither is Jarvis-Judice-Ninke error diffusion, which passes each pixel's rounding error on to twelve neighbors.
