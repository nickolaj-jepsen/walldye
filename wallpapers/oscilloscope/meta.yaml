title: Oscilloscope
description: An oscilloscope in XY mode turns two sine waves in a whole-number ratio into a closed Lissajous figure.
alt: A looping curve with rounded lobes at four corners crosses itself on a gridded screen beside three knobs and a small light.
notes: |
  In XY mode the beam moves sideways with one signal and up and down with the other. The default ratio is three to two and the other version's is five to four. The trace is cut into four tones by how far the beam moves between samples, and a second copy just off it stands in for the afterglow of the screen's phosphor.
