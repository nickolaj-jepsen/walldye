title: Sun glitter
description: Rows of dashes shorten toward a half-set sun. The ones beneath it are lit as a widening glitter path.
notes: |
  Each dash stands for one wave facet. Only the facets tilted to throw the light back at the eye catch it, so the lit ones gather in a band under the disc that widens as the water comes closer. The empty sky over a level horizon follows Hiroshi Sugimoto's *Seascapes* photographs.
