title: Sun glitter
description: Sun glitter on water comes from the few wave facets tilted to reflect the sun toward the viewer.
alt: Half a sun sits on the horizon above rows of short dashes that shrink with distance; those under it form a band widening downward.
notes: |
  Each dash is one wave facet, and only those tilted toward the viewer catch the sun. The empty sky over a level horizon follows Hiroshi Sugimoto's *Seascapes* photographs.
