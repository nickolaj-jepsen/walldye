title: Accretion disk
description: Gravity bends light around an event horizon, so the accretion disk is never hidden behind it.
alt: Concentric rings form a flat oval around a blank circle, arching over its top and curving under its bottom, strongest toward the left.
notes: |
  Each line is an isoradial: every point of the disk at one distance from the hole, the curves Jean-Pierre Luminet plotted in 1979 for his simulated photograph of such a disk. A point-lens formula stands in here for tracing each ray. The thin rim under the shadow is the disk's underside, its light bent around the hole.

  The disk turns with its left side coming towards us. Relativistic beaming boosts the light from that side, so the rings grow stronger from right to left, and the outer, cooler rings fade out.
