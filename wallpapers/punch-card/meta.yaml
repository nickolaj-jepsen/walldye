title: Punch card
description: An 80-column punch card spells a nixos-rebuild command in Hollerith code. One column lights up under a read line.
notes: |
  The holes follow the IBM 029 keypunch code. Columns 10 to 57 spell `NIXOS-REBUILD SWITCH --FLAKE .#DESKTOP --UPGRADE`, and columns 73 to 80 hold a sequence number, as on a card from a program deck.
