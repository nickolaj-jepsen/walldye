title: Starfall patent sheet
description: 'Two patent figures: Radahn''s greatsword with field lines for its gravity crest, and a crater under a filled-in falling star.'
notes: |
  Figure 1 follows the Starscourge Greatsword from *Elden Ring*: a curved blade, a crossguard of curling scrolls, and the gravity crest Radahn engraved on it, drawn as a dipole field with a web fanning from each end.

  Figure 2 is a section through the crater that opens near Fort Haight in Limgrave once Radahn is defeated, with west on the left. The numbers mark the nucleus, a field loop, the tip-side web, the crossguard, the star, rubble held up over the bowl and a waterfall down the terraces.
