title: E1M1 BSP splits
description: Quake's Slipgate Complex cut by nine levels of BSP split planes, beside a lit node path to the exit leaf.
notes: |
  John Romero built E1M1 for *Quake* in 1996. This plan comes from the map source he released in 2006, compiled with ericw-tools. Lines mark the vertical split planes near the root of the BSP tree, the top two levels standing out more. Dashes fill the canal and a sparse dot screen fills the slime. North points right, or up on a tall screen.

  The column at the side is the path through the tree from its root to the leaf holding the level exit. Each stub is the branch not taken and ends in a square for solid space, a ring for an empty leaf or a dot for a further split. Diamonds mark splits on angled planes.
