title: Mille Miglia 1955
description: The 1955 Mille Miglia, Brescia to Rome and back, on a halftone relief map of Italy. The Apennine crossing from Florence to Bologna is lit.
notes: |
  Stirling Moss and Denis Jenkinson won the 1955 Mille Miglia in a Mercedes-Benz 300 SLR, covering 1,597 km of public roads in 10 hours, 7 minutes and 48 seconds at an average of 157.65 km/h, the fastest in the race's history. The route ran clockwise from Brescia: east to Padua, down the Adriatic coast to Pescara, inland through L'Aquila to Rome, north through Siena and Florence to Bologna, back along the Via Emilia to Piacenza, then through Cremona and Mantua. The open square is the start and finish at Brescia, and the filled ones are the towns where each car's route card was stamped. The lit stretch is the 107 km from Florence over the Futa and Raticosa passes to Bologna, one of the hardest parts of the course, and the high ground beside it picks up the light.

  The line follows today's roads through the towns on the 1955 route, avoiding the motorways and keeping to the old state roads where they survive. The land is a clustered-dot halftone whose dots grow with height, so the Alps and the Apennines stand a step above the plains.
