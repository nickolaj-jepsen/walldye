title: Hitomezashi
description: Running stitches in rows and columns, with one ring-shaped region filled like an appliqué patch and its border picked out.
notes: |
  In hitomezashi every row and column is one line of evenly spaced running stitches, and the only choice per line is whether it starts with a stitch or a gap. Most lines here start opposite to their neighbour, which draws long diagonal steps.

  Each screen shape is stitched from its own pair of binary strings. Of the regions that close round a hole, the one nearest a point right of centre (centred on a tall screen) becomes the patch, so the ring differs from screen to screen. Every closed loop of stitches in such a pattern is an odd number of stitches wide and tall, and Colin Defant and Noah Kravitz proved that its length is always 4 more than a multiple of 8.
