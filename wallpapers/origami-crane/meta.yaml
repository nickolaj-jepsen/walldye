title: Origami crane
description: A paper crane balances on one corner of the square it came from, whose creases show as dashed mountain and valley folds.
notes: |
  The crease pattern is the bird base, from which the traditional crane is folded. Valley folds are dashed and mountain folds dash-dotted, as in folding diagrams, and a dimension line marks one side of the square. On tall screens the crane stands on the top corner instead.
