title: Origami crane
description: The traditional origami crane is folded from a square creased into the bird base.
alt: A paper crane of flat triangular faces stands on one corner of a square of dashed crease lines, with a dimension line along one side.
notes: |
  Valley folds are dashed and mountain folds dash-dotted, the usual convention in folding diagrams. On tall screens the crane stands on the top corner instead.
