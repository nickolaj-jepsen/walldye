title: Star trails
description: Earth's rotation turns the sky about 15 degrees an hour, so a long exposure draws each star as an arc.
alt: Hundreds of curved star trails circle a point beyond the upper left corner, over a row of spruces; three trails cross the middle.
notes: |
  These trails are 38 degrees long, which at 15 degrees an hour stands for about two and a half hours of exposure. The forest is one outline: a low canopy where it grows dense, with taller spruces rising from it.
