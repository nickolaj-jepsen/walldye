title: Drag racing tree
description: A drag racing starting tree, where in bracket racing the slower car's go lamp lights first.
alt: 'Two columns of five round lamps under two rows of small bulbs; the left column''s fourth lamp and the right column''s small bulbs are lit.'
notes: |
  Each lane has its own column: a pair of small pre-stage bulbs over a pair of stage bulbs, then three countdown lamps, the go lamp and the foul lamp. Trees label the pairs Pre-Stage and Stage, though at NHRA's national events a split ring of small lamps replaced them in 2011.

  Each driver predicts a time for the run, and the slower car gets its go lamp earlier by the difference. That car's staging bulbs go out once it has pulled out of the staging beams.
