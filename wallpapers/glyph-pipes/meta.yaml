title: Glyph pipes
description: Box-drawing pipes cross the screen as in the pipes.sh screensaver, the newest still growing behind a block cursor.
notes: |
  pipes.sh is a Bash screensaver, first posted to the Arch Linux forums in 2010, that grows pipes of box-drawing characters across a terminal. Here each pipe is a random walk that has to leave the screen again. Of forty tries per pipe, the one that best fills the emptiest part of the screen is kept, and no pipe enters the top-left corner.
