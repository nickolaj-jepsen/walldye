title: Square sunset
description: The square Minecraft sun sets behind stepped hills and one oak, its halo dithered under flat clouds.
notes: |
  In *Minecraft* the sun and the moon are flat square textures on opposite sides of the sky, so as the sun sets in the west the moon comes up in the east. The hills are four ridges of whole blocks, one behind the other, and the oak stands side-on on a small plateau of the second ridge from the back.
