title: De Clare arms, hatched
description: The de Clare arms hatched in Petra Sancta's system on a compass-built shield, beside a key to all seven tinctures.
notes: |
  Silvester Petra Sancta's *Tesserae gentilitiae* (1638) gave each heraldic tincture a texture, so arms could be engraved in a single ink. Here the field is the metal or, drawn as dots, and the chevronels are gules, drawn as upright lines. The key beside the shield runs through all seven tinctures in his order, metals first.

  The shield is the classic heater: each side of its base is an arc centred on the opposite flank, with the shield's width as its radius. The chevronels follow the proportions of the Clare blazon on Wikimedia Commons. The de Clare earls of Hertford bore these arms, and *Crusader Kings* gives its dynasties coats of arms taken from medieval heraldry.
