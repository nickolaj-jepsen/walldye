title: Vectorscope
description: A broadcast vectorscope reads colour bars as a hexagon through six target boxes, with a cluster on the skin-tone line.
notes: |
  A vectorscope plots the colour of a video signal around a circle: the angle gives the hue and the distance from the centre gives the saturation. Standard colour bars land in the six labelled boxes, and skin of every complexion falls close to one line, which camera operators use to check faces.
