title: Vectorscope
description: A vectorscope plots the color of video as angle for hue and distance from the center for saturation.
alt: A circular scale with a six-sided trace touching small boxes at its corners and a cluster of dots along a line toward the upper left.
notes: |
  Standard color bars land in the six labeled boxes, and skin of every complexion falls close to one line, which camera operators use to check faces.
