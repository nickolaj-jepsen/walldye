title: Vectorscope
description: A broadcast vectorscope reads color bars as a hexagon through six target boxes, with a cluster on the skin-tone line.
notes: |
  A vectorscope plots the color of a video signal around a circle: the angle gives the hue and the distance from the center gives the saturation. Standard color bars land in the six labeled boxes, and skin of every complexion falls close to one line, which camera operators use to check faces.
