title: Star chart
description: On a stereographic star chart, circles on the sky stay circles, so each coordinate line is an arc.
alt: Faint curved grid lines cross scattered small stars, and five larger stars joined in a W include Schedar, ringed at the W's fourth point.
notes: |
  Star positions and magnitudes (brightness, where larger numbers are fainter), down to magnitude 7.3, come from XHIP, an extended Hipparcos compilation, as packaged by d3-celestial.
