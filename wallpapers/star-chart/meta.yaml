title: Star chart
description: Cassiopeia's W on a stereographic atlas page, Schedar circled, grid lines curving round the unseen pole.
notes: |
  Star positions and magnitudes, down to magnitude 7.3, come from XHIP, an extended Hipparcos compilation, as packaged by d3-celestial. A stereographic projection keeps every circle on the sky a circle on the page, so each coordinate line is a circular arc.
