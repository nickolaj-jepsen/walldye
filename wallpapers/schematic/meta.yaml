variants:
  default:
    label: Low-pass filter
  wien-bridge:
    label: Wien-bridge oscillator
    description: A Wien-bridge oscillator on a dotted grid. A resistor and capacitor carry the output back to the input, and that lit loop keeps a sine wave going.
  instrumentation:
    label: Instrumentation amplifier
    description: Three op-amps on a dotted grid form an instrumentation amplifier. Two lit inputs pass through buffers and meet at a third op-amp, which amplifies their difference.
  triangle-wave:
    label: Triangle-wave generator
    description: Two op-amps in a lit loop on a dotted grid. One ramps up and down, the other flips at each end, and the pair makes triangle and square waves.
