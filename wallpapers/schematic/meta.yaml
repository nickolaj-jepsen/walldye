variants:
  default:
    label: Low-pass filter
  wien-bridge:
    label: Wien-bridge oscillator
    alt: One op-amp with a loop from its output back to its input through a resistor and capacitor, plus a resistor and capacitor to ground.
    description: A Wien-bridge oscillator generates a sine wave, feeding its output back through resistor-capacitor networks.
  instrumentation:
    label: Instrumentation amplifier
    alt: Two op-amps stacked at left each take one input and feed a third op-amp at right, which has the single output.
    description: An instrumentation amplifier amplifies the difference between two inputs while rejecting what they share, using three op-amps.
  triangle-wave:
    label: Triangle-wave generator
    alt: Two op-amps side by side, the right one's output wired around the bottom back to the left one's input, a capacitor over the left one.
    description: 'A triangle-wave generator: one op-amp ramps up and down while a second flips at each end.'
