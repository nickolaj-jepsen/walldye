title: Double slit
description: Light through two slits makes bright and dark bands where waves from the two slits add or cancel.
alt: Crossing arcs spread from two gaps in a wall toward a screen at the right, where horizontal lines of varying length form a comb.
notes: |
  Light arrives as a plane wave and leaves each slit as circular crests. Crests from the two slits add where the paths to the slits differ by a whole number of wavelengths, and each such curve ends on a bright fringe.

  Each line of the comb is as long as the light is bright at that point on the screen. Each slit is a quarter as wide as the slit spacing, so the spread of light through one slit, the dashed curve, dims the fringes in groups and all but removes every fourth one.
