title: Core memory plane
description: Tilted ferrite rings on a wire lattice fade away from one byte being read. Three of its eight cores are lit.
notes: |
  Each ferrite ring stores one bit as the direction of its magnetization. A read drives the selected core to zero, and a core that held a one flips and sends a pulse down the diagonal sense wire. The rings tilt in alternate directions to make room for those diagonals.

  In a real memory stack each plane holds one bit of every word, so a byte is spread over eight planes. Here it sits along one wire and holds 00101010.
