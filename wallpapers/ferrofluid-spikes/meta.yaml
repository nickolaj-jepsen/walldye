title: Ferrofluid spikes
description: Ferrofluid in a strong magnetic field rises from a flat pool into a regular pattern of spikes.
alt: A low solid dome with tapering spikes rising from it, tallest near the middle, each edged with a thin line of light on its right.
notes: |
  Above a critical field strength the flat surface is unstable and settles into peaks and valleys, known as the Rosensweig or normal-field instability. Here the peaks stand on a hexagonal lattice, tallest at the middle of the puddle.
