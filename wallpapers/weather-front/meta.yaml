title: Weather front
description: 'Isobars wind round a low, and a front curls into it and splits: pennants on one branch, domes on the other.'
notes: |
  Pennants mark the cold front and domes the warm front, each on the side the front is moving towards. Where the cold front has caught up with the warm one, the occluded front carries both, alternating, into the low.

  A high sits off to one side, and the dotted graticule of a conic map projection runs under the isobars.
