title: Weather front
description: On weather charts, triangles mark a cold front and half circles a warm one, on the side each moves toward.
alt: Pressure lines run around a low at upper center; a curving line, triangles on one branch and half circles on the other, runs into it.
notes: |
  Where the cold front has caught up with the warm one, the occluded front carries both symbols, alternating, into the low.
