title: Compass construction
description: Richmond's 1893 pentagon with every ruler-and-compass line left in. A dot marks the first vertex found.
notes: |
  Herbert Richmond published both constructions in a two-page note in 1893. For the pentagon, the left radius is halved and its midpoint joined to the top of the circle. The line bisecting the angle at the midpoint crosses the upright radius at the height of the first vertex, and the compass, opened to one side, steps off the other four.

  The seventeen-sided version quarters an angle by bisecting it twice and sets a 45-degree angle beside it. Two circles then cut the horizontal diameter at the feet of the third and fifth vertices.
