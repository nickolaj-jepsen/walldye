title: Axis-parallel walk
description: A random walk whose steps alternate between horizontal and vertical and have random lengths.
alt: One right-angled path leaves a square of overlapping ones through its right wall and ends at a small filled square.
notes: |
  The walk comes from Georg Nees' 1964 plotter drawing *Achsenparalleler Irrweg* (axis-parallel maze): steps that alternate between horizontal and vertical, each of random length, inside a square. Here the strides are longer and older steps fade.
