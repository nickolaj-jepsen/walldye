title: Pollution cloud
description: Pollution from a small Factorio smelting base spreads in chunk-sized steps and has reached two of three biter nests.
notes: |
  Factorio tracks pollution per chunk of 32 by 32 tiles and spreads it to neighbouring chunks. Trees soak some of it up, and biter spawners that absorb it send attacks.
