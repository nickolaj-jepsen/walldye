title: Microprocessor die
description: 'A microprocessor die is wired to its package pins by bond wires that start at pads on its edge.'
alt: A chip layout with square pads on its edges and wires running to the screen borders; its lower left block holds four matching columns.
notes: |
  Each block is divided into rectangles by recursive straight cuts.

  The ALU repeats one bit slice four times, mirroring every other copy so that neighbors share their rails, and a carry chain runs along its foot.
