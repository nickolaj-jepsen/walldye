title: Dürer's magic square
description: Dürer's magic square from Melencolia I adds to 34 along every row, column and diagonal.
alt: Dot clusters in a four-by-four square count from 1 to 16, joined by one zigzag line; the bottom middle pair read 15 and 14.
notes: |
  Joining the numbers of the square in order with one line is an idea from Vera Molnár's plotter drawings. Each cell also holds its number as a count of dots, and the bottom row's middle pair gives the year the square was engraved, 1514.
