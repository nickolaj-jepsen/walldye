title: Reaction-diffusion
description: A reaction-diffusion labyrinth frays into empty space and breaks into spots toward one corner, the nearest lit.
notes: |
  Two chemicals spread over a grid at different speeds. One is fed in everywhere, the other feeds on it and drains away, and those two rates decide what grows, as John Pearson mapped in 1993.

  Here the rates drift across the screen: a labyrinth of worms in one part, single spots towards the corner, and nothing past a ragged edge, where the shapes thin out at random. Each outline is traced where the second chemical reaches a fixed level. The other version moves the corner to rates where the labyrinth closes into a mesh of holes instead.
