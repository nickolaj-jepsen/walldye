title: Reaction-diffusion
description: In reaction-diffusion, two chemicals that react and spread at different speeds can form spots and stripes.
alt: A maze of winding shapes fills the right half, with round spots at the lower right corner and the left side empty.
notes: |
  One chemical is fed in everywhere, and the other feeds on it and drains away; those two rates decide what grows, as John Pearson mapped in 1993.

  Here the feed and drain rates change across the screen, and each outline is traced where the second chemical reaches a fixed level. The other version uses rates where the labyrinth closes into a mesh of holes.
