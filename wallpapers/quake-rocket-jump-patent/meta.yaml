title: Rocket jump patent sheet
description: 'A patent sheet for Quake''s rocket jump: the player''s box blasted along a ticked arc onto a ledge.'
notes: |
  The flight is worked out from the game's QuakeC source and engine. The player is the collision box, 32 units wide and 56 tall, jumping at a run while aiming 80 degrees down, as far as the view goes. The rocket bursts on the floor about 0.03 seconds later. Its splash does 120 damage less half the distance, halved for the shooter, and each point of damage adds 8 units a second of push. Figure 2 adds that push to the running jump as vectors: 402 and 407 units a second combine into 743, enough to land on a ledge 220 units up.
