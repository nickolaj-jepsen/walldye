title: Lightning
description: Lightning grown cell by cell toward the ground. The channel that touches down is lit, and stalled branches thin and fade.
notes: |
  The bolt follows the dielectric breakdown model of Niemeyer, Pietronero and Wiesmann. The electric potential is solved on a grid between the cloud base and the ground, and each new cell joins the tree with a chance that rises with the potential there, weighted toward growing downward. The first branch to reach the ground becomes the return stroke; stubs of a few cells and branches that ran mostly sideways are left out.
