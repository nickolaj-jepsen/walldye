title: Suprematist drift
description: Parallel rectangles, the nearest one lit, drift up a curve in two staggered rows and shrink with distance.
notes: |
  Malevich's *Suprematist Composition: Airplane Flying* (1915) sets flat blocks on a diagonal across an empty ground. Here ten of them follow one curve, spaced by size, with a hairline between the two rows. On tall screens the drift turns steeper to climb the long side.
