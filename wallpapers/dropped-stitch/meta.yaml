title: Dropped stitch
description: A dropped knit stitch unravels down its column, one row at a time, leaving a strand across each row.
alt: Rows of small V-shaped knit stitches cover the screen, with a column of thin arcs running down to one loose loop of yarn.
notes: |
  Nothing holds a stitch once it slips off the needle, and the slack strands it leaves turn its column into a ladder. The fabric is stockinette, whose front shows rows of V-shaped stitches.
