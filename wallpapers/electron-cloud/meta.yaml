title: Electron cloud
description: 'Hydrogen''s 3d orbital as sampled points: a lobe above the nucleus, one below, and a ring between.'
notes: |
  Each dot is a random point, drawn more often where the electron is more likely to be found, then thinned so that no two sit too close. The dots pack closer and step up in tone where more of the cloud lies behind them.

  The faint axes carry a tick every five Bohr radii. Larger orbitals are drawn at a smaller scale, so their ticks sit closer together.
