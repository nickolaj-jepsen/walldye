title: Fedora infinity
description: Fedora's infinity mark worked out with compass and rule. Centers, a radius and the circle under its squared-off corner are marked, and the lower loop is filled in.
notes: |
  Each part is snapped from the official artwork to a grid whose step is an eighth of the stroke's width. The bubble is a circle 48 steps in radius with its lower-left quarter squared off; the hook and the loop are arcs of 11 and 14 steps, measured to the middle of the stroke. The loop stops half a stroke short of the stem, where the two strands of the infinity cross. Guide lines run on only outside the bubble, so none of them crosses the f.
