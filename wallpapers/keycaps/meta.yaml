title: Keycaps
description: A keyboard corner in the tenkeyless layout, which is the full-size layout without the number pad.
alt: 'The top-left of a tilted keyboard: a lone Escape key, two groups of four function keys and the start of the number row.'
notes: |
  Each keycap is four stacked rounded rectangles: the skirt, a top face set back so its front wall shows, a dish shaded at its back wall, and the floor of the dish. The layout is ANSI, the US key arrangement.
