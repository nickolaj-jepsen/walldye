title: Keycaps
description: A mechanical keyboard's top-left corner, seen at a tilt. Escape is picked out, and the other keys fade into the plate.
notes: |
  Each keycap is four stacked rounded rectangles: the skirt, a top face set back so its front wall shows, a dish shaded at its back wall, and the floor of the dish. The keys follow the ANSI tenkeyless layout.
