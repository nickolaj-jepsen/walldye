title: String on pegs
description: A taut string winds around ten of twelve pegs on a lattice of small rings, cutting inside three.
notes: |
  After Dmitri Cherniak's *Ringers* (2021). The winding is picked from 4,000 random tours of the pegs: tours whose string runs close to itself, grazes a peg it passes, or leaves one of the largest pegs outside are dropped, and of the rest the longest loop without one overlong straight run is kept.
