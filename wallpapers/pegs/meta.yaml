title: Band and string
description: A taut string winds round a staggered block of ten pegs, pulled inside two of them, with a looser band stretched round the whole block.
notes: |
  A string wound round pegs of different sizes is the idea behind Dmitri Cherniak's generative series. Here the pegs sit in staggered rows on a triangular lattice, and a second, slacker band holds the block together. The winding is picked from 12,000 random tours: tours whose string runs close to itself, grazes a peg it passes, or leaves one of the largest pegs outside are dropped, and of the rest the longest loop without one overlong straight run is kept.
