title: Pixel invaders
description: Five rows of invaders, fading toward the top, hold over cratered bunkers while one crab dives along a dotted trail.
notes: |
  In *Space Invaders* the aliens start in five rows of eleven, and the bunkers wear away from above as bombs land and from below when the player fires from underneath. Aliens that break formation and dive at the player came a year later, in Namco's *Galaxian*.
