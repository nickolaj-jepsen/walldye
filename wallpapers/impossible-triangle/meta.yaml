title: Impossible triangle
description: A Penrose tribar in three flat tones on an isometric dot grid, construction lines crossing where its points would be.
notes: |
  Oscar Reutersvärd drew the first impossible triangle in 1934, from a series of cubes. Lionel and Roger Penrose arrived at it independently and published it in 1958.

  This one is stacked from 24 cubes on an isometric grid and drawn back to front. At one joint the far end of the third bar is sorted a full diagonal further back than it sits, so the first bar passes in front of it.
