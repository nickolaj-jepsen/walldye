title: Lean angle
description: A leaning motorcycle tire rolls onto its shoulder, so the patch touching the ground moves across the tread.
alt: Outlines of a tire section tilt from upright to a steep lean; the last is cut open, with the tread that met the road marked.
notes: |
  The section is a 200/65 R17 slick on a 6.00-inch rim, the rear size Pirelli brought to the Superbike World Championship in 2018. Its tread is drawn as an arc of 108 mm radius. The tire rolls across that arc without slipping, and the wheel center drops and moves sideways along the ticked curve above.

  The positions are 16.5 degrees apart. The last is 66 degrees, the lean shown for Marc Márquez's MotoGP Honda in Turn 3 at the Sachsenring in practice for the 2019 German Grand Prix, on another maker's tires. The construction is that of a generic radial tire. Since the tire does not slip, the arc of tread that has met the ground is as long as the stretch of ground between the first and last contact.
