title: Lean angle
description: A motorcycle's rear racing tire in section, caught five times as it rolls from upright onto its shoulder. The strip of tread that met the ground is lit.
notes: |
  The section is a 200/65 R17 slick on a 6.00-inch rim, the rear size Pirelli brought to the Superbike World Championship in 2018. Its tread is drawn as an arc of 108 mm radius. As the bike leans, the tire rolls across that arc without slipping, so the point touching the ground walks out from the crown towards the shoulder, and the wheel center drops and moves sideways along the ticked curve above.

  The positions are 16.5 degrees apart. The last is 66 degrees, the lean shown for Marc Márquez's MotoGP Honda in Turn 3 at the Sachsenring in practice for the 2019 German Grand Prix, on another maker's tires. That position is cut and hatched: the tread rubber, the carcass ply wrapped round the steel bead wires, and the belt under the tread cut across its cords. The rim it sits on is dashed. The construction is that of a generic radial tire. The tread rubber that has met the ground is lit, and its arc is as long as the lit stretch of ground between the first and last contact.
