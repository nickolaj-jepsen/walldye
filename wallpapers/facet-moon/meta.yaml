title: Faceted moon
description: A low-poly moon lit from behind, so only a crescent of facets on its upper left catches the light.
notes: The moon starts as an icosahedron whose 20 faces are each cut into 16 triangles and pushed out onto a sphere, 320 facets in all. Corners on the near side are nudged a little so the facets look cut by hand, and each facet's tone steps down with the angle between its face and the sun.
