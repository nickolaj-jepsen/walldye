title: Faceted moon
description: A moon of 320 flat triangles, made by splitting an icosahedron's 20 faces and pushing them out to a sphere.
alt: A sphere of flat triangles sits right of center; a thin crescent of facets along its upper left edge is shaded, the rest outlined.
notes: |
  Each of the icosahedron's 20 faces is cut into 16 triangles. Corners on the near side are nudged a little so the facets look cut by hand, and each facet's tone steps down with the angle between its face and the sun.
