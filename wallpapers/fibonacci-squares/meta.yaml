title: Whirling squares
description: A 1 by 1.618 rectangle on a drafting sheet, cut into twelve shrinking squares with a spiral of quarter arcs drawn through.
notes: |
  The long side comes from the compass construction left on the sheet as a dashed arc: a radius from the midpoint of the first square's base to its far top corner swings down to the base line. Every square cut off leaves a smaller rectangle of the same shape, and the squares close in on the point where the dash-dot diagonals cross.

  The spiral is one quarter circle per square, so it only approximates the logarithmic spiral through the same corners. The dimension lines split the long side into 1 and 0.618 and give the short side as 1.
