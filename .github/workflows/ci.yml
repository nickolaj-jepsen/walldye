name: CI

# build renders the published pieces, then makes the one dist that e2e tests and deploy uploads.
# Doc-only changes skip it; lint.yml and python.yml cover the rest.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'infra/**'
      - 'LICENSES/**'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production after the tests pass (main only)
        type: boolean
        default: false

permissions: {}

# A newer run supersedes an older one on the same PR. On main runs queue instead, so a push never
# throws away a render or a deploy in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold cache means rendering the whole catalogue from scratch.
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      cold: ${{ steps.compare.outputs.cold }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Page views by day, for the index's view sorts; views.yml writes the branch, and until its
      # first run the checkout fails and the sorts are left out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: stats
          path: stats
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The self-hosted Pyodide runtime, which `astro build` would otherwise download (scripts/pyodide.mjs).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/py
          key: pyodide-${{ hashFiles('pnpm-lock.yaml', 'scripts/pyodide.mjs') }}

      # The newest build saved by main; `walldye build` redraws only what changed since.
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wallpapers/*/build
          key: builds-${{ github.run_id }}
          restore-keys: builds-
      - name: Hash the restored templates
        run: |
          # A piece removed since the cached build leaves a folder with no meta.yaml.
          for d in wallpapers/*/; do [ -e "$d/meta.yaml" ] || rm -rf "$d"; done
          find wallpapers -path '*/build/*' -name '*.svg' -print0 | xargs -0 -r sha256sum | sort > "$RUNNER_TEMP/before.txt"
      # Stops short of the job's timeout, so a render that runs long still saves what it drew.
      - id: render
        run: uv run walldye build --all --published
        timeout-minutes: 105
      # Saved even after a failed or timed-out render: build re-hashes every template it keeps.
      - if: >-
          always() && steps.render.outcome != 'skipped'
          && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wallpapers/*/build
          key: builds-${{ github.run_id }}-${{ github.run_attempt }}
      - id: compare
        name: List the pieces whose templates changed
        env:
          COLD: ${{ steps.restore.outputs.cache-matched-key == '' }}
        run: |
          find wallpapers -path '*/build/*' -name '*.svg' -print0 | xargs -0 -r sha256sum | sort > "$RUNNER_TEMP/after.txt"
          changed=$(comm -3 "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" | awk '{print $NF}' | cut -d/ -f2 | sort -u)
          echo "cold=$COLD" >> "$GITHUB_OUTPUT"
          { echo 'changed<<EOF'; [ -z "$changed" ] || printf '%s\n' "$changed"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          printf 'Changed pieces: %s\n' "$(tr '\n' ' ' <<< "$changed")" >> "$GITHUB_STEP_SUMMARY"
      - run: uv run python tests/python/fixtures/regen.py

      - run: pnpm test
      - run: pnpm astro build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      # What the Playwright specs read from the repo besides dist: slots.json, the reference
      # pieces' templates and the Python reference renders.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-inputs
          path: |
            tests/fixtures/
            wallpapers/*/build/**/slots.json
            wallpapers/dither-moon/build/
            wallpapers/radar-sweep/build/
            wallpapers/schotter/build/
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
      # Browsers come from the cache when it hits; --with-deps still installs the system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      # Test the dist that deploy will upload instead of building a second one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-inputs
          path: .
      - run: pnpm exec playwright test --project=chromium
        env:
          E2E_SKIP_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: [build, e2e]
    # Dependabot's pull requests get no Actions secrets, so they are tested but never deployed.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Records each deploy on GitHub; production only accepts main.
    environment:
      name: ${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: >-
        ${{ github.event_name != 'pull_request' && 'https://walldye.com'
        || steps.deploy.outputs.pages-deployment-alias-url
        || steps.deploy.outputs.deployment-url }}
    # Only for the preview comment; the job never checks out code.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # No checkout here, so wrangler can't read git and gets the commit explicitly.
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dependabot can't see this pin; bump it by hand.
          wranglerVersion: '4.143.0'
          command: >-
            pages deploy dist --project-name=walldye
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Post or update the preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          CHANGED: ${{ needs.build.outputs.changed }}
          COLD: ${{ needs.build.outputs.cold }}
        run: |
          # Fallback when wrangler reports no alias, named the way Pages names them.
          alias=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
          url=${ALIAS_URL:-https://$alias.walldye.pages.dev}
          marker='<!-- walldye-preview -->'
          if [ "$COLD" = true ]; then
            changes='No cached build of main to compare with: every piece was drawn afresh.'
          elif [ -z "$CHANGED" ]; then
            changes='No piece draws differently from the last build of main.'
          else
            n=$(printf '%s\n' "$CHANGED" | wc -l)
            list=$(printf '%s\n' "$CHANGED" | head -n 30 | sed "s|.*|- [&]($url/&)|")
            more=$([ "$n" -le 30 ] || echo "- and $((n - 30)) more")
            changes=$(printf 'Draws differently from the last build of main (%s):\n%s\n%s' "$n" "$list" "$more")
          fi
          body=$(printf '%s\nPreview of %s: %s\n\n%s' "$marker" "${HEAD_SHA:0:7}" "$url" "$changes")

          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
