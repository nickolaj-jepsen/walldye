name: CI

# build renders the pieces, then makes the one dist that e2e tests and deploy uploads; a pull
# request with drafts deploys a second dist that also shows them.
# Doc-only changes skip it; lint.yml and python.yml cover the rest.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'infra/**'
      - 'LICENSES/**'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production after the tests pass (main only)
        type: boolean
        default: false

permissions: {}

# A newer run supersedes an older one on the same PR. On main runs queue instead, so a push never
# throws away a render or a deploy in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold cache means rendering the whole catalog from scratch.
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      cold: ${{ steps.compare.outputs.cold }}
      drafts: ${{ steps.list-drafts.outputs.drafts }}
      drafts-failed: ${{ steps.drafts.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Page views by day, for the index's view sorts; views.yml writes the branch, and until its
      # first run the checkout fails and the sorts are left out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: stats
          path: stats
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The newest build saved by main; `walldye build` redraws only what changed since.
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wallpapers/*/build
          key: builds-${{ github.run_id }}
          restore-keys: builds-
      - name: Hash the restored templates
        run: |
          # A piece removed since the cached build leaves a folder with no meta.yaml.
          for d in wallpapers/*/; do [ -e "$d/meta.yaml" ] || rm -rf "$d"; done
          find wallpapers -path '*/build/*' -name '*.svg' -print0 | xargs -0 -r sha256sum | sort > "$RUNNER_TEMP/before.txt"
      # Stops short of the job's timeout, so a render that runs long still saves what it drew.
      - id: render
        run: uv run walldye build --all --published
        timeout-minutes: 105
      # Drafts are cached and previewed but never fail the run: one that doesn't build is left out.
      - id: drafts
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: uv run walldye build --all
        timeout-minutes: 10
      # Saved even after a failed or timed-out render: build re-hashes every template it keeps.
      - if: >-
          always() && steps.render.outcome != 'skipped'
          && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wallpapers/*/build
          key: builds-${{ github.run_id }}-${{ github.run_attempt }}
      - id: compare
        name: List the pieces whose templates changed
        env:
          COLD: ${{ steps.restore.outputs.cache-matched-key == '' }}
        run: |
          find wallpapers -path '*/build/*' -name '*.svg' -print0 | xargs -0 -r sha256sum | sort > "$RUNNER_TEMP/after.txt"
          changed=$(comm -3 "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" | awk '{print $NF}' | cut -d/ -f2 | sort -u)
          echo "cold=$COLD" >> "$GITHUB_OUTPUT"
          { echo 'changed<<EOF'; [ -z "$changed" ] || printf '%s\n' "$changed"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          printf 'Changed pieces: %s\n' "$(tr '\n' ' ' <<< "$changed")" >> "$GITHUB_STEP_SUMMARY"
      - id: list-drafts
        name: List the drafts the preview shows
        if: github.event_name == 'pull_request'
        shell: uv run python {0}
        run: |
          import json
          import os
          from pathlib import Path

          # A path under the site and its title, one per built draft piece or draft version.
          lines = []
          for slug, p in json.loads(Path("wallpapers/index.json").read_text()).items():
              if p["draft"]:
                  lines.append(f"{slug}\t{p['title']}")
              for name, v in p["variants"].items():
                  if v["draft"] and Path(f"wallpapers/{slug}/build/{name}/slots.json").exists():
                      lines.append(f"{slug}?v={name}\t{p['title']}: {v['label']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("drafts<<EOF\n" + "".join(f"{line}\n" for line in lines) + "EOF\n")
      - run: uv run python scripts/fixtures/regen.py

      - run: pnpm test
      # Type-checks the site, the client and the tests; it needs the rendered builds, so it runs here.
      - run: pnpm check
      - run: pnpm astro build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      # Bundled here, where node_modules is, and kept out of dist/, which is served as assets.
      - run: pnpm build:worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker
          path: worker-bundle
          if-no-files-found: error
          retention-days: 1
      - if: steps.list-drafts.outputs.drafts != ''
        run: pnpm astro build --outDir preview
        env:
          WALLDYE_DRAFTS: '1'
      - if: steps.list-drafts.outputs.drafts != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview
          path: preview
          if-no-files-found: error
          retention-days: 1
      # What the Playwright specs read from the repo besides dist: slots.json, the reference
      # pieces' templates and the Python reference renders.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-inputs
          path: |
            tests/fixtures/
            wallpapers/*/build/**/slots.json
            wallpapers/dither-moon/build/
            wallpapers/radar-sweep/build/
            wallpapers/loose-squares/build/
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
      # Browsers come from the cache when it hits; --with-deps still installs the system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      # Test the dist that deploy will upload instead of building a second one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-inputs
          path: .
      - run: pnpm exec playwright test --project=chromium
        env:
          E2E_SKIP_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            .cache/playwright/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: [build, e2e]
    # Dependabot's pull requests get no Actions secrets, so they are tested but never deployed.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Records each deploy on GitHub; production only accepts main.
    environment:
      name: ${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: >-
        ${{ github.event_name != 'pull_request' && 'https://walldye.com'
        || steps.deploy.outputs.preview-url }}
    # pull-requests only for the preview comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only wrangler's config; the Worker comes bundled from build. With no package.json or lockfile,
      # wrangler-action installs wrangler alone, so no dependency's code runs next to the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /wrangler.jsonc
      # A pull request with drafts deploys the dist that shows them; e2e tested the one without.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.drafts != '' && 'preview' || 'dist' }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker
          path: worker-bundle
      # A pull request gets the Preview pr-<number>, which its later pushes update.
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dependabot can't see this pin; bump it by hand with preview-cleanup.yml's.
          wranglerVersion: '4.143.0'
          command: >-
            ${{ github.event_name == 'pull_request'
            && format('preview --name=pr-{0}', github.event.pull_request.number)
            || 'deploy' }}
            worker-bundle/index.js
            --message=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Post or update the preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          CHANGED: ${{ needs.build.outputs.changed }}
          COLD: ${{ needs.build.outputs.cold }}
          DRAFTS: ${{ needs.build.outputs.drafts }}
          DRAFTS_FAILED: ${{ needs.build.outputs.drafts-failed }}
        run: |
          url=${PREVIEW_URL:?wrangler reported no Preview URL}
          url=${url%/}
          marker='<!-- walldye-preview -->'
          if [ "$COLD" = true ]; then
            changes='No cached build of main to compare with: every piece was drawn afresh.'
          elif [ -z "$CHANGED" ]; then
            changes='No piece draws differently from the last build of main.'
          else
            n=$(printf '%s\n' "$CHANGED" | wc -l)
            list=$(printf '%s\n' "$CHANGED" | head -n 30 | sed "s|.*|- [&]($url/&)|")
            more=$([ "$n" -le 30 ] || echo "- and $((n - 30)) more")
            changes=$(printf 'Draws differently from the last build of main (%s):\n%s\n%s' "$n" "$list" "$more")
          fi
          if [ -n "$DRAFTS" ]; then
            n=$(printf '%s\n' "$DRAFTS" | wc -l)
            list=$(printf '%s\n' "$DRAFTS" | head -n 30 | awk -F'\t' -v u="$url" '{printf "- [%s](%s/%s)\n", $2, u, $1}')
            more=$([ "$n" -le 30 ] || echo "- and $((n - 30)) more")
            changes=$(printf '%s\n\nDrafts in this preview (%s):\n%s\n%s' "$changes" "$n" "$list" "$more")
          fi
          if [ "$DRAFTS_FAILED" = true ]; then
            changes=$(printf '%s\n\nSome drafts failed to build and are left out; the build log names them.' "$changes")
          fi
          body=$(printf '%s\nPreview of %s: %s\n\n%s' "$marker" "${HEAD_SHA:0:7}" "$url" "$changes")

          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      # What e2e's astro preview can't show: the Worker's 404 handling, the _headers rules and /e.
      - name: Check the deployed site
        timeout-minutes: 5
        env:
          SITE: >-
            ${{ github.event_name != 'pull_request' && 'https://walldye.com'
            || steps.deploy.outputs.preview-url }}
        run: |
          site=${SITE%/}
          templates=(dist/t/*)
          # All checks share one retry budget while the deploy spreads; each gets at least one try.
          deadline=$((SECONDS + 180))
          # check <path> <status> <regex over headers and body>
          check() {
            local out
            while :; do
              out=$(curl -sS --connect-timeout 5 --max-time 15 -D - "$site$1" 2>&1) || true
              if [[ $out =~ ^HTTP/[0-9.]+\ $2 ]] && grep -qiE "$3" <<< "$out"; then
                echo "ok $1"
                return 0
              fi
              ((SECONDS + 10 < deadline)) || break
              sleep 10
            done
            echo "::error::$site$1: expected $2 and /$3/"
            sed '/^\r*$/q' <<< "$out"
            return 1
          }
          check "/no-such-piece-$GITHUB_RUN_ID" 404 '<title>Not found'
          check "/${templates[0]#dist/}" 200 '^cache-control: public, max-age=31536000, immutable'
          check /about 200 '^cache-control: public, max-age=0, must-revalidate'
          # The Worker answers /e; a GET stores nothing, and gets 503 while EVENTS_KEY is unset.
          check /e 405 '^allow: POST'
          # Only walldye.com is measured; a missing beacon would save days of zero views.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            check / 200 'cloudflareinsights\.com/beacon'
          fi
