name: CI

# build renders the published pieces, tests and makes dist; deploy uploads it from main.
# Doc-only changes skip it; checks.yml covers the rest.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'infra/**'
      - 'LICENSES/**'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production after the tests pass (main only)
        type: boolean
        default: false

permissions: {}

# A newer run supersedes an older one on the same PR. On main runs queue instead, so a push never
# throws away a render or a deploy in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold cache means rendering the whole catalog from scratch.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Page views by day, for the index's view sorts; views.yml writes the branch, and until its
      # first run the checkout fails and the sorts are left out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: stats
          path: stats
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The newest build saved by main; `walldye build` redraws only what changed since.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wallpapers/*/build
          key: builds-${{ github.run_id }}
          restore-keys: builds-
      # A piece removed since the cached build leaves a folder with no meta.yaml.
      - run: for d in wallpapers/*/; do [ -e "$d/meta.yaml" ] || rm -rf "$d"; done
      # Stops short of the job's timeout, so a render that runs long still saves what it drew.
      - id: render
        run: uv run walldye build --all --published
        timeout-minutes: 105
      # Saved even after a failed or timed-out render: build re-hashes every template it keeps.
      - if: >-
          always() && steps.render.outcome != 'skipped'
          && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wallpapers/*/build
          key: builds-${{ github.run_id }}-${{ github.run_attempt }}
      - run: uv run python scripts/fixtures/regen.py

      - run: pnpm test
      # Type-checks the site, the client and the tests; it needs the rendered builds, so it runs here.
      - run: pnpm check
      - run: pnpm astro build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Records each deploy on GitHub; production only accepts main.
    environment:
      name: production
      url: https://walldye.com
    permissions:
      contents: read
    steps:
      # Only the files wrangler reads. With no package.json or lockfile, wrangler-action installs
      # wrangler alone, so no dependency's code runs next to the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /wrangler.jsonc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dependabot can't see this pin; bump it by hand.
          wranglerVersion: '4.143.0'
          command: deploy --message=${{ github.sha }}
