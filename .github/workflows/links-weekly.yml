name: Links (weekly)

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No --cache: this run exists to look at every link fresh.
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200..=299,403,429
            'wallpapers/*/meta.yaml'
          fail: false
          failIfEmpty: false
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          title='Broken links in wallpaper sources'
          numbers=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number")
          number=${numbers%%$'\n'*}
          if [ "$EXIT_CODE" != 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file lychee/out.md
            else
              gh issue create --title "$title" --body-file lychee/out.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment 'Every link resolves again.'
          fi
