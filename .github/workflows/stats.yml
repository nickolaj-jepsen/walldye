name: Stats (daily)

# Records each finished day's page views and product events on the stats branch, then redeploys
# main so the index's sorts include them. Cloudflare samples page views once a day is a few days
# old, and Analytics Engine keeps events for three months, so run it daily.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  # Runs the fetch scripts and their dependencies with read-only access; the push job runs none.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: checkout
        name: Check out the stats branch
        run: |
          if git fetch --depth=1 origin stats; then
            git worktree add --detach stats FETCH_HEAD
          else
            mkdir stats
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the missing page views
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/stats/views.ts stats/views
      # Each fetch writes only whole days, so what one wrote is pushed even when the other failed.
      - name: Fetch the missing events
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/stats/events.ts stats/events
      - if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stats
          path: stats
          if-no-files-found: ignore
          retention-days: 1

  push:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Push to stats, and start ci.yml: a push made with GITHUB_TOKEN starts no workflow.
      contents: write
      actions: write
    steps:
      # Credentials stay for the push to stats; nothing below installs or runs third-party code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the stats branch
        run: |
          if git fetch --depth=1 origin stats; then
            git worktree add --detach stats FETCH_HEAD
          else
            git worktree add --detach stats
            git -C stats switch --orphan stats
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stats
          path: stats
      - id: push
        name: Commit and push them
        working-directory: stats
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git diff --cached --name-only | sed -n 's|^.*/\([0-9-]\{10\}\)\.json$|\1|p' | sort | tail -n 1)
          # all.json alone changes when its format does.
          message="stats through $last"
          [ -n "$last" ] || message='stats: rebuild events/all.json'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$message"
          git push origin HEAD:refs/heads/stats
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - if: ${{ steps.push.outputs.changed == 'true' }}
        name: Redeploy main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main -f deploy=true
