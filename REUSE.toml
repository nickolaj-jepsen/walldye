# Third-party data inside a wallpaper folder keeps its upstream license and notice, whatever the
# folder's meta.yaml `license:` says. The texts are in LICENSES/.
version = 1

[[annotations]]
path = "wallpapers/star-chart/data/*.json"
SPDX-FileCopyrightText = "2015 Olaf Frohn (d3-celestial)"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "wallpapers/racing-spa-minisectors/data/spa.json"
SPDX-FileCopyrightText = [
  "Chair of Automotive Technology, Technical University of Munich (TUMFTM racetrack-database)",
  "OpenStreetMap contributors",
]
SPDX-License-Identifier = "LGPL-3.0-only AND ODbL-1.0"

[[annotations]]
path = "wallpapers/racing-canada-lap-chart/data/laps.json"
SPDX-FileCopyrightText = "jolpica-f1 contributors"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

[[annotations]]
path = "wallpapers/racing-monaco-tunnel/data/monaco.json"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"

[[annotations]]
path = "wallpapers/racing-pikes-peak/data/course.json"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"

[[annotations]]
path = "wallpapers/flight-arcs/data/routes.json"
SPDX-FileCopyrightText = "OpenFlights contributors"
SPDX-License-Identifier = "ODbL-1.0"
